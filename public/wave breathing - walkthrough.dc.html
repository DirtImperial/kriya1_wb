<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#06040f">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" fill="#06040f"/>
<circle cx="50" cy="44" r="13" fill="#5b7cff"/>
<circle cx="50" cy="44" r="20" fill="none" stroke="#57e0d6" stroke-width="1.4" opacity="0.7"/>
<circle cx="50" cy="44" r="27" fill="none" stroke="#57e0d6" stroke-width="1" opacity="0.35"/>
<text x="50" y="78" fill="#f6e23a" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">BREATHE</text>
</svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,16..72,300;0,16..72,400;1,16..72,300&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#04040a; }
  ::-webkit-scrollbar { width:0; height:0; }
  @keyframes kenburns { 0%{transform:scale(1)} 100%{transform:scale(1.08)} }
  @keyframes crownPulse { 0%,100%{opacity:.78} 50%{opacity:1} }
  @keyframes twinkle { 0%,100%{opacity:.5} 50%{opacity:.95} }
  @keyframes twinkle2 { 0%,100%{opacity:.3} 50%{opacity:.7} }
  @keyframes driftSlow { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(0,-24px,0)} }
  @keyframes driftSlow2 { 0%{transform:translate3d(0,0,0)} 100%{transform:translate3d(14px,18px,0)} }
  @keyframes seatedFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.4%)} }
  @keyframes diagramPulse { 0%,100%{transform:scale(.975); opacity:.85} 50%{transform:scale(1.03); opacity:1} }
  @keyframes hintFade { 0%,100%{opacity:.35} 50%{opacity:.7} }
  @keyframes finaleGlow { 0%,100%{filter:brightness(1) drop-shadow(0 0 18px rgba(120,170,255,.45))} 50%{filter:brightness(1.12) drop-shadow(0 0 34px rgba(150,190,255,.7))} }
</style>
</helmet>

<div ref="{{ rootRef }}" onClick="{{ onStageClick }}" style="position:relative; height:100dvh; overflow:hidden; background:#04040a; color:#fff; font-family:'Space Grotesk',sans-serif; cursor:pointer; user-select:none;">

  <!-- ===== BACKGROUND LAYERS ===== -->
  <div data-layer="landscape" style="position:absolute; inset:0; opacity:1; transition:opacity 1.3s ease; z-index:0;">
    <img data-mountain src="assets/01-landscape.png" alt="" style="width:100%; height:100%; object-fit:cover; object-position:center 40%; animation:kenburns 28s ease-in-out infinite alternate;">
  </div>

  <div data-layer="stars" style="position:absolute; inset:0; opacity:0; transition:opacity 1.3s ease; z-index:0; background:radial-gradient(125% 100% at 50% 22%, #0c0b20 0%, #08070f 56%, #0a0708 100%);">
    <div style="position:absolute; inset:-12%; background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.4px 1.4px at 28% 42%,#cdd6ff,transparent),radial-gradient(1.6px 1.6px at 47% 12%,#fff,transparent),radial-gradient(1.3px 1.3px at 63% 33%,#d7c4ff,transparent),radial-gradient(1.5px 1.5px at 78% 21%,#fff,transparent),radial-gradient(1.6px 1.6px at 88% 48%,#bcd0ff,transparent),radial-gradient(1.4px 1.4px at 18% 64%,#fff,transparent),radial-gradient(1.3px 1.3px at 38% 80%,#d7c4ff,transparent),radial-gradient(1.6px 1.6px at 72% 70%,#fff,transparent),radial-gradient(1.4px 1.4px at 92% 82%,#cdd6ff,transparent); animation:twinkle 6s ease-in-out infinite, driftSlow 44s ease-in-out infinite alternate;"></div>
    <div style="position:absolute; inset:-12%; background-image:radial-gradient(1px 1px at 8% 30%,#fff,transparent),radial-gradient(1px 1px at 22% 60%,#bcd0ff,transparent),radial-gradient(1px 1px at 40% 26%,#fff,transparent),radial-gradient(1px 1px at 55% 52%,#e8def9,transparent),radial-gradient(1px 1px at 68% 14%,#fff,transparent),radial-gradient(1px 1px at 82% 62%,#cdd6ff,transparent),radial-gradient(1px 1px at 96% 36%,#fff,transparent),radial-gradient(1px 1px at 32% 90%,#fff,transparent),radial-gradient(1px 1px at 60% 86%,#d7c4ff,transparent); animation:twinkle2 9s ease-in-out infinite, driftSlow2 64s ease-in-out infinite alternate;"></div>
  </div>

  <!-- finale figure sits over the mountain, midsection on the horizon -->
  <div data-layer="finale" style="position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; z-index:1; pointer-events:none;">
    <img src="assets/breath-3.png" alt="luminous body" style="position:absolute; left:50%; top:60%; transform:translate(-50%,-56%); height:min(78dvh,660px); width:auto; mix-blend-mode:screen; animation:finaleGlow 7s ease-in-out infinite;">
  </div>

  <!-- vignette + bottom scrim for legibility -->
  <div style="position:absolute; inset:0; pointer-events:none; z-index:6; background:radial-gradient(120% 90% at 50% 34%, transparent 42%, rgba(4,4,12,.5) 100%);"></div>
  <div style="position:absolute; left:0; right:0; bottom:0; height:50%; pointer-events:none; z-index:6; background:linear-gradient(180deg, transparent 0%, rgba(4,4,12,.4) 46%, rgba(4,4,12,.9) 100%);"></div>
  <div data-layer="welcomedim" style="position:absolute; inset:0; pointer-events:none; z-index:6; opacity:1; transition:opacity 1.1s ease; background:rgba(4,4,12,.4);"></div>

  <!-- ===== FOREGROUND: graphic zone (top) + text zone (bottom) ===== -->
  <div style="position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; pointer-events:none;">

    <div data-graphiczone style="flex:1 1 auto; position:relative; min-height:0; overflow:hidden;">
      <!-- seated posture frames (crossfade) -->
      <div data-layer="seated" style="position:absolute; inset:0; opacity:0; transition:opacity 1s ease; mix-blend-mode:screen;">
        <img data-seat="0" src="assets/seat-hands.png" alt="hands rest on knees" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
        <img data-seat="1" src="assets/seat-cushions.png" alt="use a cushion" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
        <img data-seat="2" src="assets/seat-shoulders.png" alt="shoulders relaxed" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
        <img data-seat="3" src="assets/seat-spine.png" alt="spine upright" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
        <img data-seat="4" src="assets/seat-chin.png" alt="chin down" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
        <img data-seat="5" src="assets/seat-heart.png" alt="heart emanates" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
        <img data-seat="6" src="assets/seat-crown.png" alt="awareness of crown" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; opacity:0; transition:opacity .9s ease; animation:seatedFloat 8s ease-in-out infinite;">
      </div>

      <!-- wave breathing diagram -->
      <div data-layer="wavediagram" style="position:absolute; inset:0; opacity:0; transition:opacity 1s ease; mix-blend-mode:screen; display:flex; align-items:center; justify-content:center;">
        <img src="assets/wave-diagram.png" alt="wave breathing cycle" style="width:min(92%,680px); max-height:88%; object-fit:contain; animation:diagramPulse 9s ease-in-out infinite;">
      </div>

      <!-- vessel fill (breath-0..3 crossfade, breath-paced) -->
      <div data-layer="vessel" style="position:absolute; inset:0; opacity:0; transition:opacity 1s ease; mix-blend-mode:screen;">
        <img data-vfig="0" src="assets/breath-0.png" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:3% 6%; opacity:1;">
        <img data-vfig="1" src="assets/breath-1.png" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:3% 6%; opacity:0;">
        <img data-vfig="2" src="assets/breath-2.png" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:3% 6%; opacity:0;">
        <img data-vfig="3" src="assets/breath-3.png" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:3% 6%; opacity:0;">
      </div>

      <!-- luminous column -->
      <div data-layer="column" style="position:absolute; inset:0; opacity:0; transition:opacity 1s ease; mix-blend-mode:screen; display:flex; align-items:center; justify-content:center;">
        <img src="assets/seat-column.png" alt="luminous column" style="width:100%; height:100%; object-fit:contain; padding:4% 6% 6%; animation:seatedFloat 8s ease-in-out infinite;">
      </div>
    </div>

    <!-- text zone -->
    <div data-textzone style="flex:0 0 auto; position:relative; z-index:11; padding:16px clamp(22px,5vw,64px) 72px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:clamp(8px,1.4vw,14px);">
      <div data-eyebrow style="font-size:clamp(.66rem,1.5vw,.8rem); letter-spacing:.4em; text-transform:uppercase; color:#57e0d6;">{{ eyebrow }}</div>
      <h1 style="font-weight:600; font-size:clamp(2rem,6.2vw,4rem); line-height:1.02; letter-spacing:-.02em; text-wrap:balance;">{{ title }}</h1>
      <p data-body style="font-family:'Newsreader',serif; font-weight:300; font-size:clamp(1.12rem,2.5vw,1.5rem); color:rgba(255,255,255,.86); line-height:1.45; max-width:32ch;">{{ body }}</p>
      <ul data-remember style="display:none; list-style:none; flex-direction:column; gap:10px; margin-top:2px; text-align:left;">
        <sc-for list="{{ reminders }}" as="r" hint-placeholder-count="5">
          <li style="display:flex; gap:12px; align-items:baseline; font-family:'Newsreader',serif; font-weight:300; font-size:clamp(1rem,2.3vw,1.22rem); color:rgba(255,255,255,.86); line-height:1.4;">
            <span style="flex:none; width:6px; height:6px; border-radius:50%; background:#57e0d6; transform:translateY(2px);"></span>
            <span>{{ r }}</span>
          </li>
        </sc-for>
      </ul>
    </div>
  </div>

  <!-- page-1 first-run affordance -->
  <div data-hint style="position:absolute; left:0; right:0; bottom:46px; z-index:15; opacity:1; transition:opacity .8s ease; pointer-events:none; text-align:center; font-size:.66rem; letter-spacing:.34em; text-transform:uppercase; color:rgba(255,255,255,.6); animation:hintFade 2.4s ease-in-out infinite;">Tap anywhere to begin</div>

  <!-- page indicator -->
  <div onClick="{{ onDot }}" style="position:absolute; left:50%; transform:translateX(-50%); bottom:22px; z-index:20; display:flex; gap:8px; align-items:center; pointer-events:auto;">
    <sc-for list="{{ stages }}" as="s" hint-placeholder-count="13">
      <span data-dot="{{ $index }}" style="width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.32); cursor:pointer; transition:all .35s ease; display:block;"></span>
    </sc-for>
  </div>

  <!-- fullscreen toggle -->
  <button onClick="{{ onFullscreen }}" aria-label="Toggle fullscreen" style="position:absolute; top:16px; right:16px; z-index:20; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:10px; color:#fff; cursor:pointer; backdrop-filter:blur(6px); pointer-events:auto; transition:background .2s ease;" style-hover="background:rgba(255,255,255,.18)">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { stage: 0 };

  get STAGES() {
    return [
      { eyebrow: 'Full Body Kriya', title: 'Wave Breathing', accent: '#57e0d6', bg: 'mountain' },
      { eyebrow: 'The Seat', title: 'Hands rest on knees', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 0, body: 'Palms down, arms soft and easy.' },
      { eyebrow: 'The Seat', title: 'Lift the hips if tight', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 1, body: 'If the hips aren\u2019t open, sit up on a cushion.' },
      { eyebrow: 'The Seat', title: 'Shoulders relaxed', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 2, body: 'Let them drop and hang off the spine.' },
      { eyebrow: 'The Seat', title: 'Spine upright', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 3, body: 'Tall, but never rigid.' },
      { eyebrow: 'The Seat', title: 'Chin slightly down', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 4, body: 'Lengthen the back of the neck.' },
      { eyebrow: 'The Seat', title: 'Heart emanates', accent: '#a98bff', bg: 'stars', graphic: 'seated', seat: 5, body: 'Let the heart-center radiate outward.' },
      { eyebrow: 'The Seat', title: 'Awareness of crown', accent: '#a98bff', bg: 'stars', graphic: 'seated', seat: 6, body: 'Rest a soft attention just above the head.' },
      { eyebrow: 'The Breath', title: 'Breathe in waves', accent: '#57e0d6', bg: 'stars', graphic: 'wave', body: 'Equal in, equal out. Never hold.' },
      { eyebrow: 'The Vessel', title: 'Fill & empty', accent: '#ff5e9c', bg: 'stars', graphic: 'vessel', body: 'Each breath fills and empties the whole body.' },
      { eyebrow: 'The Spine', title: 'Luminous column', accent: '#bcd0ff', bg: 'stars', graphic: 'column', body: 'A bright channel runs the length of the spine.' },
      { eyebrow: 'As One', title: 'Breathing as one', accent: '#ffd27a', bg: 'finale', body: 'Breath, energy and spine \u2014 one current.' },
      { eyebrow: 'Remember', title: 'Remember', accent: '#57e0d6', bg: 'stars', remember: true, body: '' }
    ];
  }

  componentDidMount() {
    this._lastStage = this.state.stage;
    this.applyStage();
    this.startVessel();
    this._onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); this.go(this.state.stage + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.go(this.state.stage - 1); }
    };
    window.addEventListener('keydown', this._onKey);
  }
  componentWillUnmount() {
    if (this._onKey) window.removeEventListener('keydown', this._onKey);
    if (this._vTimer) clearInterval(this._vTimer);
  }
  componentDidUpdate() { if (this._lastStage !== this.state.stage) { this._lastStage = this.state.stage; this.applyStage(); this.fadeText(); } }

  // breath-paced fill: 0->1->2->3 (inhale) then 3->2->1->0 (exhale)
  startVessel() {
    const seq = [0, 1, 2, 3, 2, 1];
    let i = 0;
    this._vTimer = setInterval(() => {
      const figs = this.root && this.root.querySelectorAll('[data-vfig]');
      if (!figs) return;
      i = (i + 1) % seq.length;
      const on = seq[i];
      figs.forEach((f) => { f.style.transition = 'opacity 1.4s ease'; f.style.opacity = (+f.dataset.vfig === on) ? 1 : 0; });
    }, 1500);
  }

  applyStage() {
    if (!this.root) return;
    const s = this.state.stage, S = this.STAGES[s];
    const set = (n, op) => { const el = this.root.querySelector('[data-layer="' + n + '"]'); if (el) el.style.opacity = op; };
    set('landscape', (S.bg === 'mountain' || S.bg === 'finale') ? 1 : 0);
    set('stars', S.bg === 'stars' ? 1 : 0);
    set('finale', S.bg === 'finale' ? 1 : 0);
    set('seated', S.graphic === 'seated' ? 1 : 0);
    set('wavediagram', S.graphic === 'wave' ? 1 : 0);
    set('vessel', S.graphic === 'vessel' ? 1 : 0);
    set('column', S.graphic === 'column' ? 1 : 0);
    set('welcomedim', s === 0 ? 1 : 0);
    // mountain framing: title shows peak high; finale drops horizon to lower-centre
    const mtn = this.root.querySelector('[data-mountain]');
    if (mtn) mtn.style.objectPosition = S.bg === 'finale' ? 'center 48%' : 'center 40%';
    this.root.querySelectorAll('[data-seat]').forEach((im) => {
      im.style.opacity = (S.graphic === 'seated' && +im.dataset.seat === S.seat) ? 1 : 0;
    });
    const eb = this.root.querySelector('[data-eyebrow]');
    if (eb) eb.style.color = S.accent || '#57e0d6';
    const body = this.root.querySelector('[data-body]');
    const rem = this.root.querySelector('[data-remember]');
    if (body) body.style.display = S.remember ? 'none' : 'block';
    if (rem) rem.style.display = S.remember ? 'flex' : 'none';
    const hint = this.root.querySelector('[data-hint]');
    if (hint) hint.style.opacity = s === 0 ? 1 : 0;
    const dots = this.root.querySelectorAll('[data-dot]');
    dots.forEach((d, di) => {
      const on = di === s;
      d.style.background = on ? '#fff' : 'rgba(255,255,255,.32)';
      d.style.transform = on ? 'scale(1.6)' : 'scale(1)';
      d.style.boxShadow = on ? '0 0 8px rgba(255,255,255,.8)' : 'none';
    });
  }

  fadeText() {
    const el = this.root && this.root.querySelector('[data-textzone]');
    if (!el) return;
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(10px)';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .6s ease, transform .6s ease';
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
  }

  go(i) {
    const last = this.STAGES.length - 1;
    if (i < 0) i = 0;
    if (i > last) i = 0;
    if (i !== this.state.stage) this.setState({ stage: i });
  }

  renderVals() {
    const s = this.STAGES[this.state.stage];
    return {
      rootRef: (el) => { this.root = el; },
      stages: this.STAGES,
      eyebrow: s.eyebrow, title: s.title, body: s.body,
      reminders: [
        'Never fully fill or empty.',
        'Keep the diaphragm soft.',
        'Let the rhythm turn involuntary.',
        'Always picture in and out.',
        'Pairs with any kriya.'
      ],
      onStageClick: () => this.go(this.state.stage + 1),
      onDot: (e) => { e.stopPropagation(); const t = e.target.closest('[data-dot]'); if (t) this.go(+t.dataset.dot); },
      onFullscreen: (e) => {
        e.stopPropagation();
        const el = this.root;
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        if (!fsEl) { const req = el.requestFullscreen || el.webkitRequestFullscreen; if (req) req.call(el); }
        else { const exit = document.exitFullscreen || document.webkitExitFullscreen; if (exit) exit.call(document); }
      }
    };
  }
}
</script>
</body>
</html>
