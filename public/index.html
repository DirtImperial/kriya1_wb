<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { stage: 0, partsOpen: false, mapPart: -1 };

  get STAGES() {
    const rows = [
      { eyebrow: 'Full Body Kriya', title: 'Wave Breathing', accent: '#57e0d6', bg: 'mountain' },
      { eyebrow: 'The Seat', title: 'Finding your seat', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 0, body: 'Sit your body comfortably on a flat surface. Whether in a chair or cross legged it is most important to be at ease.' },
      { eyebrow: 'The Seat', title: 'Lift the hips if tight', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 1, body: 'If the hips aren\u2019t open, sit up on a cushion.' },
      { eyebrow: 'The Seat', title: 'Shoulders relaxed', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 2, body: 'Let them drop and hang off the spine. Imagine gravity is pulling them down and keeping the spine straight.' },
      { eyebrow: 'The Seat', title: 'Spine upright', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 3, body: 'Tall, but never rigid.' },
      { eyebrow: 'The Seat', title: 'Position the head', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 4, body: 'Chin slightly down to lengthen the cervical spine. Eyes lightly closed or partially open.' },
      { title: 'Place the hands', accent: '#9fd4ff', bg: 'stars', graphic: 'hands-down', body: 'Find a position for your hands there is no right or wrong; palms down on knees, palms up, or hands together in the lap. Let them rest and be sensitive.' },
      { eyebrow: 'The Seat', title: 'Heart emanates', accent: '#a98bff', bg: 'stars', graphic: 'seated', seat: 5, body: 'Imagine a gentle force moving outward from the solar plexus into the space around you' },
      { eyebrow: 'The Seat', title: 'Awareness of crown', accent: '#a98bff', bg: 'stars', graphic: 'seated', seat: 6, body: 'Rest a soft attention just above the head.' },
      { title: 'The empty vessel', accent: '#bcd0ff', bg: 'stars', graphic: 'empty-outline', still: true, body: 'Feel the outline of the body as an open vessel. Notice the space within, while the breath continues easily.' },
      { eyebrow: 'The Breath', title: 'Breathe in waves', accent: '#57e0d6', bg: 'stars', graphic: 'wave', body: 'Equal in, equal out. Never hold.' },
      { eyebrow: 'The Vessel', title: 'Fill & empty', accent: '#ff5e9c', bg: 'stars', graphic: 'vessel', body: 'Each breath fills and empties the whole body.' },
      { title: 'SO HUM', accent: '#bcd0ff', bg: 'stars', graphic: 'mantra', still: true, body: 'Upon inhalation gently intone the sound "SO" along the entire inhalation and then vocalize the sound "HA" along the exhalation ending with an "UMMM" much like an "OM".' },

      { title: 'SO HUM', accent: '#bcd0ff', bg: 'stars', graphic: 'mantra-cycle', still: true, body: 'After several rounds of quietly vocalizing the "SO HUM" rhythmic mantra then internalize the sounds in your inner mind until it becomes a steady almost involuntary inner sound.' },

      { title: 'Envision your spine', accent: '#bcd0ff', bg: 'stars', graphic: 'column', body: 'Visualize a hollow luminous column roughly in the center of your back. With every in-breath and out-breath it becomes more awake and energized.' },

      { title: (window.waveEnvironment === 'mountain' ? 'Ground, mountain, sky' : window.waveEnvironment === 'office' ? 'Seat, window, lamp' : 'Roots, trunk, branches'), accent: '#ffd27a', bg: 'finale', breath: true, body: (window.waveEnvironment === 'mountain' ? 'Imagine your body in an empty expanse, spanning the ground, the mountain and the sky.' : window.waveEnvironment === 'office' ? 'Imagine your body settled in the room: your pelvis resting in the chair, your torso rising toward the window, and your crown open beneath the lamp.' : 'Imagine your body aligned with the tree: your pelvis and sacrum are the roots, your torso is the trunk, and your throat, head and crown are the branches.') },

      { title: 'Rest in the expanse', accent: '#ffd27a', bg: 'finale', breath: true, body: (window.waveEnvironment === 'mountain' ? 'Let the horizon pass through the navel and the mountain peak meet the third eye. Allow the sky to open above you.' : window.waveEnvironment === 'office' ? 'Feel the chair beneath you and the quiet of the room around you. Let the window light rest at the brow, and the lamp stay soft above.' : 'Feel your pelvis rooted in the ground, your torso rising with the trunk, and your head opening into the branches. Rest in the space around and within the tree.') },

      { title: 'Bring the four together', accent: '#57e0d6', bg: 'finale', breath: true, body: 'Find the seat. Follow the wave breath. Continue the SO-HUM rhythm in your mind. Hold the visualization. Let these four aspects support one practice.' },

      { title: 'Build familiarity', accent: '#57e0d6', bg: 'finale', scene: 'aligned-breath', breath: true, body: 'Build your practice with the 4 anchors: Posture, Breath, Mantra and Visualization. If you become distracted always fall back on simple rhythmic breathing and work your way back up.' },

      { title: 'Let it become natural', accent: '#57e0d6', bg: 'finale', breath: true, body: 'As the practice becomes familiar, soften the deliberate guidance. Let the rhythm become automatic, returning to an anchor whenever you need it.' },
      { title: 'Recognizing the Root Gurus', accent: '#ffdca1', bg: 'mountain', closing: true, body: 'At the end of the sit take a beat to send gratitude to all sentient beings, family, friends, mentors. Always send love to Mahavatar Babji and his line of Kriya gurus.' }
    ];
    const partNames = ['Posture','Breath','Mantra','Visualization','Integration','Compassion and Thanks'];
    const partCounts = [8, 3, 2, 3, 3, 1];
    const partOf = [null];
    partCounts.forEach((count, index) => { for (let n = 0; n < count; n++) partOf.push(partNames[index]); });
    if (partOf.length !== rows.length) console.warn('[wave] part list does not match the stage list');
    return rows.map((row, index) => ({ ...row, part: partOf[index] || null, body: row.body == null ? '' : row.body }));
  }

  chapterNames = ['Posture','Breath','Mantra','Visualization','Integration','Compassion and Thanks'];

  chapterFor(i) {
    const name = this.STAGES[i] && this.STAGES[i].part;
    if (!name) return 0;
    const index = this.chapterNames.indexOf(name);
    return index < 0 ? 0 : index + 1;
  }

  partIndexes(name, stages) {
    const indexes = [];
    (stages || this.STAGES).forEach((stage, index) => { if (stage.part === name) indexes.push(index); });
    return indexes;
  }

  placeFor(index, stages) {
    stages = stages || this.STAGES;
    const name = stages[index] && stages[index].part;
    if (!name) return null;
    const group = this.partIndexes(name, stages);
    return { name: name, step: group.indexOf(index) + 1, total: group.length, partIndex: this.chapterNames.indexOf(name) };
  }

  // Fill means acknowledged instructions. Continue and Finish acknowledge the
  // instruction on screen; Back, overview jumps and opening the map only move.
  // The intro is not an instruction, so it is never acknowledged.
  get acked() {
    return this._acked || (this._acked = new Set());
  }

  partGroups(stages) {
    return this.chapterNames.map((name, index) => {
      const indexes = this.partIndexes(name, stages);
      const acked = indexes.filter((i) => this.acked.has(i)).length;
      return { name: name, index: index, indexes: indexes, acked: acked, done: indexes.length > 0 && acked === indexes.length };
    });
  }

  locationFor(index, stages) {
    const place = this.placeFor(index, stages);
    if (!place) return 'Introduction';
    return place.name + ', part ' + (place.partIndex + 1) + ' of ' + this.chapterNames.length + ', step ' + place.step + ' of ' + place.total;
  }

  bindShell() {
    this.unbindShell();
    this._onKey = (e) => this.onKey(e);
    this._onBegin = () => this.beginPractice();
    this._onAppearance = () => this.onAppearance();
    window.addEventListener('keydown', this._onKey);
    document.addEventListener('wave-practice-begin', this._onBegin);
    document.addEventListener('wave-appearance-applied', this._onAppearance);
  }

  unbindShell() {
    if (this._onKey) window.removeEventListener('keydown', this._onKey);
    if (this._onBegin) document.removeEventListener('wave-practice-begin', this._onBegin);
    if (this._onAppearance) document.removeEventListener('wave-appearance-applied', this._onAppearance);
  }

  beginPractice() {
    this._acked = new Set();
    this._focusHeading = true;
    this._announce = true;
    // Begin and Finish open the introduction. Continue is what enters Posture.
    this.setState({ stage: 0, partsOpen: false, mapPart: -1 });
  }

  onAppearance() {
    if (window.waveSkinCommitted && typeof window.waveApplySkin === 'function') window.waveApplySkin();
    this.forceUpdate();
  }

  componentDidMount() {
    this._lastStage = this.state.stage;
    this._partsWasOpen = false;
    this.bindShell();
    this.applyStage();
    document.dispatchEvent(new CustomEvent('wave-practice-ready'));
  }

  componentWillUnmount() {
    this.unbindShell();
    this.stopShoulderRelease();
    this.stopHeadPosition();
    this.stopVessel();
    this.stopColumn();
  }

  componentDidUpdate() {
    const stageChanged = this._lastStage !== this.state.stage;
    this.syncDialog();
    if (stageChanged) {
      this._lastStage = this.state.stage;
      this.applyStage();
      this.fadeText();
    }
    if (this._announce) {
      this._announce = false;
      const live = this.root && this.root.querySelector('[data-live]');
      const stages = this.STAGES;
      if (live) live.textContent = this.locationFor(this.state.stage, stages) + '. ' + stages[this.state.stage].title;
    }
    if (window.waveSkinCommitted && typeof window.waveApplySkin === 'function') window.waveApplySkin();
    const focus = (selector) => {
      const el = this.root && this.root.querySelector(selector);
      if (el) el.focus({ preventScroll: true });
    };
    if (this._focusHeading) {
      this._focusHeading = false;
      focus('[data-heading]');
    } else if (this._focusForward) {
      this._focusForward = false;
      focus('[data-forward]');
    } else if (this._focusRow) {
      // Rows are keyed by position, so an expanded part shifts the headings after
      // it; find the activated heading again by its id.
      focus('#' + this._focusRow);
      this._focusRow = null;
    } else if (this._partsWasOpen && !this.state.partsOpen) {
      focus('[data-parts-open]');
    }
    this._partsWasOpen = !!this.state.partsOpen;
  }

  stopVessel() {
    if (this._vFrame) cancelAnimationFrame(this._vFrame);
    this._vFrame = null;
    if (this._mantraSync) cancelAnimationFrame(this._mantraSync);
    this._mantraSync = null;
    this._vStarted = null;
    this._vKey = null;
    const continuous = this.root && this.root.querySelectorAll('[data-vessel-man-continuous],[data-vessel-woman-continuous],[data-vessel-boy-continuous],[data-vessel-girl-continuous]');
    if (continuous) continuous.forEach((item) => {
      if (item.tagName === 'CANVAS') {
        const context = item.getContext('2d');
        const first = this.root.querySelector('[data-woman-flow-frame="0"]');
        context.clearRect(0, 0, item.width, item.height);
        context.imageSmoothingEnabled = false;
        if (first && first.complete && first.naturalWidth) context.drawImage(first, 0, 0);
      } else {
        if (typeof item.pause === 'function') item.pause();
        if ('readyState' in item && item.readyState) item.currentTime = 0;
        if (item.dataset.posterSrc) item.src = item.dataset.posterSrc;
      }
    });
    const figs = this.root && this.root.querySelectorAll('[data-layer="vessel"] [data-vfig]');
    if (figs) figs.forEach((fig) => {
      fig.style.transition = 'none';
      fig.style.opacity = +fig.dataset.vfig === 0 ? 1 : 0;
    });
  }

  stopHeadPosition() {
    if (this._headPositionTimer) clearTimeout(this._headPositionTimer);
    this._headPositionTimer = null;
    this._headPositionFrame = 0;
    const sequence = this.root && this.root.querySelector('.head-position-sequence');
    if (sequence) sequence.classList.remove('head-sequence-active');
  }

  stopShoulderRelease() {
    if (this._shoulderReleaseTimer) clearTimeout(this._shoulderReleaseTimer);
    this._shoulderReleaseTimer = null;
    this._shoulderReleaseFrame = 0;
  }

  startShoulderRelease() {
    this.stopShoulderRelease();
    const image = this.root && this.root.querySelector('[data-shoulder-release-frame]');
    if (!image) return;
    // Always move through the approved anatomical order: raised, releasing,
    // relaxed. Hold the settled pose before beginning the next calm cycle.
    const frameOrder = [0, 1, 2];
    const durations = [900, 700, 1500];
    const finalFrame = 2;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const show = (orderIndex) => {
      if (!this.root || this.STAGES[this.state.stage].seat !== 2) return;
      const frame = frameOrder[orderIndex];
      this._shoulderReleaseFrame = frame;
      image.dataset.avatarSlot = 'female-shoulders-relaxed-' + frame + '.png';
      if (window.waveSkinCommitted && typeof window.waveApplySkin === 'function') window.waveApplySkin();
      if (!reducedMotion) {
        const nextOrderIndex = (orderIndex + 1) % frameOrder.length;
        this._shoulderReleaseTimer = setTimeout(() => show(nextOrderIndex), durations[frame]);
      }
    };
    show(reducedMotion ? frameOrder.indexOf(finalFrame) : 0);
  }

  startHeadPosition() {
    this.stopHeadPosition();
    const image = this.root && this.root.querySelector('[data-head-position-frame]');
    if (!image) return;
    const durations = [360, 110, 110, 110, 145, 210, 340, 1440];
    const finalFrame = durations.length - 1;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reducedMotion) {
      void image.offsetWidth;
      image.parentElement.classList.add('head-sequence-active');
    }
    const show = (frame) => {
      if (!this.root || this.STAGES[this.state.stage].seat !== 4) return;
      this._headPositionFrame = frame;
      image.dataset.avatarSlot = 'female-head-position-' + frame + '.png';
      if (window.waveSkinCommitted && typeof window.waveApplySkin === 'function') window.waveApplySkin();
      if (!reducedMotion) {
        const nextFrame = frame === finalFrame ? 0 : frame + 1;
        this._headPositionTimer = setTimeout(() => show(nextFrame), durations[frame]);
      }
    };
    show(reducedMotion ? finalFrame : 0);
  }

  // Fill & empty, both SO HUM stages and the integration stages share the same breathing figure.
  breathes(S) {
    return S.graphic === 'vessel' || S.graphic === 'mantra' || S.graphic === 'mantra-cycle' || !!S.breath;
  }

  // Stages that breathe at the Fill & empty pace rather than the 12s SO HUM pace.
  breathPace(S) {
    return S.graphic === 'vessel' || S.breath ? 'fill' : 'mantra';
  }

  // A cosine-paced, continuously blended cycle: empty -> full -> empty.
  // It naturally eases at the turnarounds without introducing a breath hold.
  startVessel() {
    this.stopVessel();
    const avatar = document.documentElement.dataset.waveAvatar;
    const continuous = this.root && this.root.querySelector('[data-vessel-' + avatar + '-continuous]');
    if (continuous) {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (continuous.tagName === 'CANVAS') {
        const context = continuous.getContext('2d');
        const frames = Array.from(this.root.querySelectorAll('[data-woman-flow-frame]'));
        const draw = (level) => {
          const position = Math.max(0, Math.min(4, level));
          const low = Math.floor(position);
          const high = Math.ceil(position);
          const blend = position - low;
          context.clearRect(0, 0, continuous.width, continuous.height);
          context.imageSmoothingEnabled = false;
          context.globalAlpha = 1 - blend;
          context.drawImage(frames[low], 0, 0);
          if (high !== low) {
            context.globalAlpha = blend;
            context.drawImage(frames[high], 0, 0);
          }
          context.globalAlpha = 1;
        };
        const begin = () => {
          if (!this.root || !this.breathes(this.STAGES[this.state.stage])) return;
          if (reducedMotion) { draw(0); return; }
          this._vStarted = performance.now();
          const tick = (now) => {
            if (!this.root || !this.breathes(this.STAGES[this.state.stage])) return;
            const phase = ((now - this._vStarted) % 12000) / 12000;
            draw((1 - Math.cos(phase * Math.PI * 2)) * 2);
            this._vFrame = requestAnimationFrame(tick);
          };
          this._vFrame = requestAnimationFrame(tick);
        };
        if (frames.every((frame) => frame.complete && frame.naturalWidth)) begin();
        else Promise.all(frames.map((frame) => frame.decode())).then(begin).catch(() => draw(0));
      } else if (continuous.dataset.animatedSrc) {
        continuous.src = reducedMotion ? continuous.dataset.posterSrc : continuous.dataset.animatedSrc;
      } else if (!reducedMotion) {
        // DC strips bare boolean media attributes from the rendered template.
        // Set these properties directly so every completed breath restarts.
        continuous.loop = true;
        continuous.muted = true;
        const mantra = this.breathPace(this.STAGES[this.state.stage]) === 'mantra';
        continuous.playbackRate = mantra && continuous.duration ? continuous.duration / 12 : 1;
        if (continuous.readyState) continuous.currentTime = 0;
        const playing = continuous.play();
        if (playing && playing.catch) playing.catch(() => {});
      }
      return;
    }
    const figs = this.root && Array.from(this.root.querySelectorAll('[data-layer="vessel"] [data-vfig]'));
    if (!figs || !figs.length) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      figs.forEach((fig) => { fig.style.opacity = +fig.dataset.vfig === 1 ? 1 : 0; });
      return;
    }
    this._vStarted = performance.now();
    const tick = (now) => {
      if (!this.root || !this.breathes(this.STAGES[this.state.stage])) return;
      const phase = ((now - this._vStarted) % 12000) / 12000;
      // Use all five approved stages for every avatar: centered, gathering,
      // opening, flowing outward, and full-body illumination.
      const level = (1 - Math.cos(phase * Math.PI * 2)) * 2;
      const low = Math.floor(level);
      const high = Math.ceil(level);
      const blend = level - low;
      figs.forEach((fig) => {
        const frame = +fig.dataset.vfig;
        fig.style.transition = 'none';
        fig.style.opacity = frame === low ? 1 - blend : frame === high ? blend : 0;
      });
      this._vFrame = requestAnimationFrame(tick);
    };
    this._vFrame = requestAnimationFrame(tick);
  }

  stopColumn() {
    if (this._columnFrame) cancelAnimationFrame(this._columnFrame);
    this._columnFrame = null;
    this._columnStarted = null;
    const breathing = this.root && this.root.querySelector('[data-layer="column"] [data-column-breathing]');
    if (breathing) breathing.removeAttribute('src');
    const tube = this.root && this.root.querySelectorAll('[data-layer="column"] [data-column-tube]');
    if (tube) tube.forEach((part) => {
      const resting = { halo: .05, outer: .12, rim: .30 };
      part.style.opacity = resting[part.dataset.columnTube];
    });
    const cells = this.root && this.root.querySelectorAll('[data-layer="column"] [data-column-cell]');
    if (cells) cells.forEach((cell) => { cell.style.opacity = .16; });
  }

  // Each half-breath carries a highlight through the tube while its baseline
  // luminosity accumulates. The column becomes steadily more awake and never
  // switches off at the inhale/exhale turnarounds.
  startColumn() {
    this.stopColumn();
    const breathing = this.root && this.root.querySelector('[data-layer="column"] [data-column-breathing]');
    if (breathing && document.documentElement.dataset.waveAvatar === 'man') {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      breathing.src = reduced ? breathing.dataset.reducedSrc : breathing.dataset.src;
      return;
    }
    const tube = this.root && Array.from(this.root.querySelectorAll('[data-layer="column"] [data-column-tube]'));
    const cells = this.root && Array.from(this.root.querySelectorAll('[data-layer="column"] [data-column-cell]'));
    if (!tube || !cells || !tube.length || !cells.length) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const still = { halo: .18, outer: .34, rim: .75 };
      tube.forEach((part) => { part.style.opacity = still[part.dataset.columnTube]; });
      cells.forEach((cell) => { cell.style.opacity = .48; });
      return;
    }
    this._columnStarted = performance.now();
    const tick = (now) => {
      if (!this.root || this.STAGES[this.state.stage].graphic !== 'column') return;
      const elapsed = now - this._columnStarted;
      const phase = (elapsed % 12000) / 12000;
      const wake = .28 + .62 * (1 - Math.exp(-elapsed / 18000));
      const breath = (1 - Math.cos(phase * Math.PI * 2)) / 2;
      const travel = phase < .5 ? phase * 2 : (1 - phase) * 2;
      const levels = {
        halo: .03 + wake * .12 + breath * .03,
        outer: .06 + wake * .22 + breath * .05,
        rim: .18 + wake * .42 + breath * .10
      };
      tube.forEach((part) => { part.style.opacity = Math.min(.98, levels[part.dataset.columnTube]); });
      cells.forEach((cell) => {
        const position = +cell.dataset.columnCell / 8;
        const distance = position - travel;
        const highlight = Math.exp(-(distance * distance) / .025);
        cell.style.opacity = Math.min(.98, .08 + wake * .25 + highlight * (.42 + wake * .18));
      });
      this._columnFrame = requestAnimationFrame(tick);
    };
    this._columnFrame = requestAnimationFrame(tick);
  }

  // The second SO HUM's words begin on an inhale. Wherever the breath carried
  // over from the first SO HUM, scrub it quickly back to empty, then start the
  // breath and the words together so SO grows on the inhale and HUM on the exhale.
  // The words then follow the video's own clock, so a slow loop restart cannot
  // flash SO in before the exhale has finished.
  syncMantraBreath() {
    this.cancelMantraSync();
    const video = this.root.querySelector('[data-vessel-' + document.documentElement.dataset.waveAvatar + '-continuous]');
    if (!video || video.tagName !== 'VIDEO' || !video.duration || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const so = this.root.querySelector('[data-layer="mantra-so"]'), hum = this.root.querySelector('[data-layer="mantra-hum"]');
    so.classList.add('mantra-driven');
    hum.classList.add('mantra-driven');
    const ease = (t) => (1 - Math.cos(Math.max(0, Math.min(1, t)) * Math.PI)) / 2;
    const show = (phase) => {
      const inhale = phase < .5;
      so.firstElementChild.style.opacity = inhale ? 1 : 0;
      hum.firstElementChild.style.opacity = inhale ? 0 : 1;
      so.querySelector('text').style.transform = 'scale(' + (.35 + 2.35 * ease(phase * 2)) + ')';
      hum.querySelector('text').style.transform = 'scale(' + (1.8 - 1.15 * ease(phase * 2 - 1)) + ')';
    };
    show(0);
    video.pause();
    const from = video.currentTime, half = video.duration / 2;
    // Rewind during an inhale; run on to the end of the loop during an exhale.
    const to = from > half ? video.duration : 0;
    const length = 900 * Math.abs(to - from) / half;
    const began = performance.now();
    const token = this._mantraToken = {};
    this._mantraVideo = video;
    const step = (now) => {
      const t = length ? Math.min(1, (now - began) / length) : 1;
      if (t < 1) {
        video.currentTime = from + (to - from) * (1 - Math.cos(t * Math.PI)) / 2;
        this._mantraSync = requestAnimationFrame(step);
        return;
      }
      this._mantraSync = null;
      video.currentTime = 0;
      const playing = video.play();
      const follow = () => {
        if (this._mantraToken !== token) return;
        // At the end of a loop browsers may expose currentTime === duration
        // for several frames before resetting it to zero. Modulo would turn
        // that end frame into phase zero and flash SO over the final HUM pose.
        // Keep showing the end of HUM until the media clock actually wraps.
        if (video.duration) show(Math.min(video.currentTime / video.duration, 1));
        this._mantraFollow = requestAnimationFrame(follow);
      };
      const start = () => { if (this._mantraToken === token && !this._mantraFollow) this._mantraFollow = requestAnimationFrame(follow); };
      if (playing && playing.then) playing.then(start, start);
      else start();
    };
    this._mantraSync = requestAnimationFrame(step);
  }

  // Leaving the second SO HUM mid-sync lets a shared breath carry on playing.
  cancelMantraSync() {
    this._mantraToken = null;
    if (this._mantraFollow) cancelAnimationFrame(this._mantraFollow);
    this._mantraFollow = null;
    this.root.querySelectorAll('[data-layer="mantra-so"],[data-layer="mantra-hum"]').forEach((layer) => {
      layer.classList.remove('mantra-driven');
      layer.firstElementChild.style.opacity = '';
      layer.querySelector('text').style.transform = '';
    });
    if (!this._mantraSync) return;
    cancelAnimationFrame(this._mantraSync);
    this._mantraSync = null;
    const playing = this._mantraVideo && this._mantraVideo.play();
    if (playing && playing.catch) playing.catch(() => {});
  }

  clearSeatViewFreeze(view) {
    view.querySelectorAll('.seat-front,.seat-side').forEach((image) => {
      image.style.animation = '';
      image.style.opacity = '';
    });
  }

  // The opening instruction can be midway through its front/side dissolve when
  // the person continues. Preserve that exact mix until the whole opening pose
  // has faded away; otherwise removing the cycle class exposes the front pose
  // for one frame before the cushion pose appears.
  freezeSeatViewForExit(view) {
    const images = Array.from(view.querySelectorAll('.seat-front,.seat-side'));
    const opacities = images.map((image) => getComputedStyle(image).opacity);
    images.forEach((image, index) => {
      image.style.animation = 'none';
      image.style.opacity = opacities[index];
    });
  }

  applyStage() {
    if (!this.root) return;
    const s = this.state.stage, S = this.STAGES[s];
    this.cancelMantraSync();
    // Keep one unbroken breath across consecutive stages that share a pace.
    const breathKey = this.breathes(S) ? this.breathPace(S) + ':' + document.documentElement.dataset.waveAvatar : null;
    if (!breathKey) this.stopVessel();
    else if (breathKey !== this._vKey) { this.startVessel(); this._vKey = breathKey; }
    if (S.graphic === 'column') this.startColumn();
    else this.stopColumn();
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('closing-page', !!S.closing);
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('intro-page', s === 0);
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('practice-page', s > 0 && !S.closing);
    this.root.querySelector('[data-graphiczone]').parentElement.style.mixBlendMode = 'normal';
    if (S.still) this.root.querySelectorAll('[data-vfig]').forEach(f => f.style.opacity = +f.dataset.vfig === 0 ? 1 : 0);
    const set = (n, op) => {
      const el = this.root.querySelector('[data-layer="' + n + '"]');
      if (!el) return;
      el.style.opacity = op;
      if (op) el.removeAttribute('aria-hidden');
      else el.setAttribute('aria-hidden', 'true');
    };
    const visualization = (this.chapterFor(s) >= 4 && S.bg === 'finale') || S.scene === 'aligned-breath';
    set('visualization', visualization && !this.breathes(S) ? 1 : 0);
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('tree-aligned', visualization);
    set('landscape', !visualization && (S.bg === 'mountain' || S.bg === 'finale') ? 1 : 0);
    set('stars', S.bg === 'stars' ? 1 : 0);
    set('finale', !visualization && S.bg === 'finale' ? 1 : 0);
    set('seated', S.graphic === 'seated' ? 1 : 0);
    set('wavediagram', S.graphic === 'wave' ? 1 : 0);
    set('vessel', this.breathes(S) ? 1 : 0);
    set('column', S.graphic === 'column' ? 1 : 0);
    set('mantra', S.graphic === 'mantra' ? 1 : 0);
    set('mantra-so', S.graphic === 'mantra-cycle' ? 1 : 0);
    this.root.querySelector('[data-layer="mantra-so"]').classList.toggle('mantra-active', S.graphic === 'mantra-cycle');
    set('mantra-hum', S.graphic === 'mantra-cycle' ? 1 : 0);
    this.root.querySelector('[data-layer="mantra-hum"]').classList.toggle('mantra-active', S.graphic === 'mantra-cycle');
    if (S.graphic === 'mantra-cycle') this.syncMantraBreath();
    set('empty-outline', S.graphic === 'empty-outline' ? 1 : 0);
    const emptyOutline = this.root.querySelector('[data-layer="empty-outline"]');
    emptyOutline.classList.toggle('empty-vessel-active', S.graphic === 'empty-outline');
    if (S.graphic === 'empty-outline') {
      const outline = this.root.querySelector('[data-empty-vessel-frame]');
      if (outline) {
        const source = outline.getAttribute('src');
        if (source) {
          outline.removeAttribute('src');
          requestAnimationFrame(() => outline.setAttribute('src', source));
        }
      }
    }
    set('hands-down', S.graphic === 'hands-down' ? 1 : 0);
    this.root.querySelector('[data-layer="hands-down"]').classList.toggle('poses-active', S.graphic === 'hands-down');
    set('welcomedim', s === 0 ? 1 : 0);
    // mountain framing: title shows peak high; finale drops horizon to lower-centre
    const mtn = this.root.querySelector('[data-mountain]');
    if (mtn) mtn.style.objectPosition = S.bg === 'finale' ? 'center 48%' : 'center 40%';
    const shoulderReleaseActive = S.graphic === 'seated' && S.seat === 2;
    const headPositionActive = S.graphic === 'seated' && S.seat === 4;
    this.root.querySelectorAll('[data-seat]').forEach((im) => {
      const on = S.graphic === 'seated' && +im.dataset.seat === S.seat;
      if (im.classList.contains('seat-views')) {
        const wasCycling = im.classList.contains('seat-cycle-active');
        if (on) this.clearSeatViewFreeze(im);
        else if (wasCycling) this.freezeSeatViewForExit(im);
        im.classList.toggle('seat-cycle-active', on);
      }
      // The sequence frame itself can change instantly; the seated pose
      // container should always dissolve from the preceding pose.
      im.style.transition = 'opacity .9s ease';
      im.style.opacity = on ? 1 : 0;
      im.classList.toggle('spine-sequence-active', on && im.classList.contains('spine-upright-sequence'));
      im.classList.toggle('shoulder-cue-active', on && im.classList.contains('shoulder-release-sequence'));
      if (on) im.removeAttribute('aria-hidden');
      else im.setAttribute('aria-hidden', 'true');
    });
    if (shoulderReleaseActive) this.startShoulderRelease();
    else this.stopShoulderRelease();
    if (headPositionActive) this.startHeadPosition();
    else this.stopHeadPosition();
    // Only the intro keeps its eyebrow; the navigator says which part this is.
    const eb = this.root.querySelector('[data-eyebrow]');
    if (eb) {
      eb.style.color = S.accent || '#57e0d6';
      eb.style.display = s === 0 ? '' : 'none';
    }
    const body = this.root.querySelector('[data-body]');
    const rem = this.root.querySelector('[data-remember]');
    if (body) body.style.display = (S.body && !S.remember) ? 'block' : 'none';
    if (rem) rem.style.display = S.remember ? 'flex' : 'none';
  }

  fadeText() {
    const el = this.root && this.root.querySelector('[data-textzone]');
    if (!el) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      el.style.transition = 'none';
      el.style.opacity = '1';
      el.style.transform = 'none';
      return;
    }
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .45s ease, transform .45s ease';
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
  }

  // Moves without acknowledging anything.
  go(i) {
    if (this.state.partsOpen) return;
    if (i < 0 || i > this.STAGES.length - 1 || i === this.state.stage) return;
    this._announce = true;
    if (i === 0) this._focusForward = true; // Back is disabled on the intro
    this.setState({ stage: i });
  }

  // A click on the scene uses the same step as Continue. The instruction,
  // the navigation bar, and any open dialog keep their own clicks.
  onSceneClick(e) {
    if (e.defaultPrevented) return;
    const picker = document.getElementById('skin-picker');
    if (picker && !picker.hidden) return;
    const target = e.target;
    if (target && target.closest && target.closest('button, a, input, textarea, select, label, dialog, [data-textzone], .wb-bar, #skin-picker, #skin-reopen')) return;
    this.tapRipple(e.clientX, e.clientY);
    this.advance();
  }

  // A brief ring where the scene was tapped, so the tap reads as the step.
  // It lives on the body, outside the rendered tree, and removes itself.
  tapRipple(x, y) {
    if (!Number.isFinite(x) || !Number.isFinite(y) || (x === 0 && y === 0)) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ring = document.createElement('span');
    ring.className = 'wb-tap-ripple';
    ring.setAttribute('aria-hidden', 'true');
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.addEventListener('animationend', () => ring.remove());
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1200);
  }

  // Continue: acknowledge the instruction on screen once, then advance once.
  advance() {
    if (this.state.partsOpen) return;
    const stage = this.state.stage;
    if (this.placeFor(stage)) this.acked.add(stage);
    if (stage >= this.STAGES.length - 1) this.finish();
    else this.go(stage + 1);
  }

  // Finish resets to the opening slide and brings back the welcome page.
  finish() {
    this.beginPractice();
    document.dispatchEvent(new CustomEvent('wave-practice-finished'));
  }

  jumpToStep(i) {
    this._focusHeading = true;
    if (i !== this.state.stage) this._announce = true;
    this.setState({ stage: i, partsOpen: false });
  }

  openOverview() {
    if (this.state.partsOpen) return;
    const place = this.placeFor(this.state.stage);
    // On the intro, Posture opens for a look without becoming current.
    this.setState({ partsOpen: true, mapPart: place ? place.partIndex : 0 });
  }

  onKey(e) {
    const picker = document.getElementById('skin-picker');
    if (picker && !picker.hidden) return;
    if (this.state.partsOpen) {
      this.onPartsKey(e);
      return;
    }
    if (e.defaultPrevented) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.repeat) return;
    const target = e.target;
    if (!target || !target.tagName) return;
    const tag = target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable) return;
    if (target.closest && target.closest('dialog[open]')) return;
    if ((e.key === ' ' || e.key === 'Enter') && target.closest && target.closest('button, a')) return;
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      this.advance();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      this.go(this.state.stage - 1);
    }
  }

  // Up/Down, Home and End move between the visible part headings and steps.
  // Enter/Space keep their meaning: a heading expands, a step jumps.
  onPartsKey(e) {
    const dialog = this.root && this.root.querySelector('[data-parts-dialog]');
    if (!dialog || !dialog.contains(document.activeElement)) return;
    const rows = [...dialog.querySelectorAll('[data-map-row]')].filter((row) => !row.disabled && row.offsetParent !== null);
    const index = rows.indexOf(document.activeElement);
    if (index < 0 || !rows.length) return;
    let next = -1;
    if (e.key === 'ArrowDown') next = Math.min(index + 1, rows.length - 1);
    else if (e.key === 'ArrowUp') next = Math.max(index - 1, 0);
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = rows.length - 1;
    if (next < 0) return;
    e.preventDefault();
    rows[next].focus();
  }

  syncDialog() {
    const dialog = this.root && this.root.querySelector('[data-parts-dialog]');
    if (!dialog) return;
    if (this.state.partsOpen) {
      if (!dialog.open && dialog.showModal) {
        try { dialog.showModal(); } catch (err) {}
      }
      if (!this._partsWasOpen) {
        const heading = dialog.querySelector('#wb-sheet-title');
        if (heading) heading.focus({ preventScroll: true });
        const body = dialog.querySelector('[data-sheet-body]');
        const here = dialog.querySelector('[aria-current="step"]');
        if (body) body.scrollTop = 0;
        if (body && here) {
          const top = here.getBoundingClientRect().top - body.getBoundingClientRect().top;
          if (top + here.offsetHeight > body.clientHeight) body.scrollTop = top - body.clientHeight / 3;
        }
      }
    } else if (dialog.open) {
      dialog.close();
    }
  }

  renderVals() {
    const stages = this.STAGES;
    const stage = this.state.stage;
    const s = stages[stage];
    const place = this.placeFor(stage, stages);
    const groups = this.partGroups(stages);
    const partCount = this.chapterNames.length;
    const atEnd = stage >= stages.length - 1;
    const reviewing = !!place && this.acked.has(stage);
    const stepText = place ? (reviewing ? 'Reviewing · ' : '') + 'Step ' + place.step + ' of ' + place.total : '';
    const instructionCount = groups.reduce((sum, group) => sum + group.indexes.length, 0);

    // The six conceptual parts stay grouped, while each instruction becomes one
    // orb. That keeps the part hierarchy and makes the twenty real steps tangible.
    const segments = groups.map((group) => {
      const current = !!place && place.partIndex === group.index;
      return {
        done: group.done ? 'true' : 'false',
        current: current ? 'true' : 'false',
        fill: 'width:' + (group.acked / group.indexes.length * 100) + '%',
        orbs: group.indexes.map((index) => ({
          acked: this.acked.has(index) ? 'true' : 'false',
          current: index === stage ? 'true' : 'false'
        }))
      };
    });

    const mapRows = [];
    groups.forEach((group) => {
      const current = !!place && place.partIndex === group.index;
      const expanded = this.state.mapPart === group.index;
      const id = 'wb-map-part-' + group.index;
      const listId = 'wb-map-steps-' + group.index;
      const total = group.indexes.length;
      const meta = current ? stepText
        : group.done ? 'Done'
        : group.acked ? group.acked + ' of ' + total + ' done'
        : total + (total === 1 ? ' step' : ' steps');
      mapRows.push({
        isPart: true,
        id: id,
        name: group.name,
        meta: meta,
        state: group.done ? 'done' : group.acked ? 'partial' : 'upcoming',
        current: current ? 'true' : 'false',
        srState: current ? ', current part' : group.done ? ', completed' : '',
        expanded: expanded,
        controls: expanded ? listId : undefined,
        onToggle: (e) => {
          e.stopPropagation();
          this._focusRow = id;
          this.setState({ mapPart: expanded ? -1 : group.index });
        }
      });
      if (!expanded) return;
      // Repeated titles (the two SO HUM steps) also show the opening of their text.
      const titles = group.indexes.map((i) => stages[i].title);
      mapRows.push({
        isSteps: true,
        id: listId,
        headId: id,
        steps: group.indexes.map((i, n) => {
          const acked = this.acked.has(i);
          const here = i === stage;
          const repeated = titles.filter((title) => title === stages[i].title).length > 1;
          const words = stages[i].body.split(/\s+/);
          return {
            id: 'wb-map-step-' + i,
            num: n + 1,
            srOf: ' of ' + total + ': ',
            title: stages[i].title,
            excerpt: repeated ? words.slice(0, 6).join(' ') + (words.length > 6 ? '…' : '') : '',
            acked: acked ? 'true' : 'false',
            current: here ? 'step' : undefined,
            here: here ? (acked ? 'Reviewing · You are here' : 'You are here') : '',
            srState: acked && !here ? ', completed' : '',
            onJump: (e) => { e.stopPropagation(); this.jumpToStep(i); }
          };
        })
      });
    });

    const next = atEnd ? null : stages[stage + 1];
    const boundary = !!next && !!next.part && next.part !== s.part;
    return {
      rootRef: (el) => { this.root = el; },
      stages: stages,
      eyebrow: stage === 0 ? s.eyebrow : '',
      title: s.title,
      body: s.body,
      reminders: [
        'Never fully fill or empty.',
        'Keep the diaphragm soft.',
        'Let the rhythm turn involuntary.',
        'Always picture in and out.',
        'Pairs with any kriya.'
      ],
      partsOpen: !!this.state.partsOpen,
      navName: 'View session. ' + (place ? this.locationFor(stage, stages) + (reviewing ? ', reviewing' : '') : 'Introduction, ' + partCount + ' parts') + '.',
      navTitle: place ? place.name : 'Introduction',
      navStep: place ? stepText : partCount + ' parts',
      segments: segments,
      mapRows: mapRows,
      mapWhere: place
        ? place.name + ' · Part ' + (place.partIndex + 1) + ' of ' + partCount + ' · ' + stepText
        : 'Introduction · ' + partCount + ' parts, ' + instructionCount + ' steps',
      backDisabled: stage <= 0,
      tapHintHidden: stage !== 0 ? true : undefined,
      forwardLong: atEnd ? 'Finish session' : boundary ? 'Next: ' + next.part : 'Continue',
      forwardShort: atEnd ? 'Finish session' : 'Continue',
      forwardExtra: boundary ? ' to ' + next.part : '',
      nextCaption: boundary ? 'Next: ' + next.part : '',
      onSceneClick: (e) => this.onSceneClick(e),
      onBack: (e) => { e.stopPropagation(); this.go(stage - 1); },
      onForward: (e) => { e.stopPropagation(); this.advance(); },
      onPartsOpen: (e) => { e.stopPropagation(); this.openOverview(); },
      onPartsClose: (e) => { e.stopPropagation(); this.setState({ partsOpen: false }); },
      onPartsDismiss: () => { if (this.state.partsOpen) this.setState({ partsOpen: false }); },
      onPartsBackdrop: (e) => { if (e.target === e.currentTarget) this.setState({ partsOpen: false }); }
    };
  }
}
</script>

<script>
// Keep the 48 dithered light frames on the same twelve-second breath clock.
(() => {
  const cycleSeconds = 12;
  document.querySelectorAll('.wave-loop').forEach((loop) => {
    const frames = [...loop.querySelectorAll('.wave-flow-frame')];
    frames.forEach((frame, index) => {
      frame.style.animationDelay = `${-cycleSeconds + index * cycleSeconds / frames.length}s`;
    });
  });
})();
</script>
