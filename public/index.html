    <div data-textzone="" style="flex:0 0 auto; position:relative; z-index:11; padding:16px clamp(22px,5vw,64px) 72px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:clamp(8px,1.4vw,14px);">
      <div data-closing-mantra="">Om Kriya Babaji Kriya Om</div><img data-closing-portrait="" src="assets/babaji-mountain-v1.png" alt="Mahavatar Babaji seated before the mountain"/><div data-eyebrow="" style="font-size:clamp(.66rem,1.5vw,.8rem); letter-spacing:.4em; text-transform:uppercase; color:#57e0d6;">{{ eyebrow }}</div>
      <h1 data-heading="" tabindex="-1" style="font-weight:600; font-size:clamp(2rem,6.2vw,4rem); line-height:1.02; letter-spacing:-.02em; text-wrap:balance;">{{ title }}</h1>
      <p data-body="" style="font-family:'Space Grotesk',sans-serif; font-weight:400; font-size:clamp(1.12rem,2.5vw,1.5rem); color:rgba(255,255,255,.86); line-height:1.45; max-width:52ch;">{{ body }}</p>
      <ul data-remember="" style="display:none; list-style:none; flex-direction:column; gap:10px; margin-top:2px; text-align:left;">
        <sc-for list="{{ reminders }}" as="r" hint-placeholder-count="5">
          <li style="display:flex; gap:12px; align-items:baseline; font-family:'Newsreader',serif; font-weight:300; font-size:clamp(1rem,2.3vw,1.22rem); color:rgba(255,255,255,.86); line-height:1.4;">
            <span style="flex:none; width:6px; height:6px; border-radius:50%; background:#57e0d6; transform:translateY(2px);"></span>
            <span>{{ r }}</span>
          </li>
        </sc-for>
      </ul>
    </div>
  </div>

  <nav class="wb-bar" aria-label="Practice navigation">
    <p class="wb-sr-only" data-live role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="wb-bar-inner">
      <button type="button" class="wb-nav" data-parts-open aria-haspopup="dialog" aria-controls="wb-parts-dialog" aria-expanded="{{ partsOpen }}" aria-label="{{ navName }}" onclick="{{ onPartsOpen }}">
        <span class="wb-nav-head">
          <span class="wb-nav-name">{{ navTitle }}</span>
          <span class="wb-nav-step">{{ navStep }}</span>
          <span class="wb-nav-cue"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 8 6 4.5 9.5 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </span>
        <span class="wb-tracks">
          <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="6">
            <span class="wb-seg" data-done="{{ seg.done }}" data-current="{{ seg.current }}">
              <span class="wb-track"><span class="wb-fill" style="{{ seg.fill }}"></span></span>
            </span>
          </sc-for>
        </span>
      </button>
      <button type="button" class="wb-button wb-button-secondary" data-back onclick="{{ onBack }}" disabled="{{ backDisabled }}">Back</button>
      <span class="wb-next-caption" aria-hidden="true">{{ nextCaption }}</span>
      <button type="button" class="wb-button wb-button-primary" data-forward onclick="{{ onForward }}"><span class="wb-fwd-long">{{ forwardLong }}</span><span class="wb-fwd-short">{{ forwardShort }}<span class="wb-sr-only">{{ forwardExtra }}</span></span></button>
    </div>
  </nav>
</div>

<dialog id="wb-parts-dialog" class="wb-sheet" data-parts-dialog aria-labelledby="wb-sheet-title" aria-describedby="wb-sheet-where" onclose="{{ onPartsDismiss }}" onclick="{{ onPartsBackdrop }}">
  <header class="wb-sheet-head">
    <div class="wb-sheet-titles">
      <h2 id="wb-sheet-title" tabindex="-1">Your practice</h2>
      <p id="wb-sheet-where" class="wb-sheet-where">{{ mapWhere }}</p>
    </div>
    <button type="button" class="wb-sheet-close" data-parts-close aria-label="Close session overview" onclick="{{ onPartsClose }}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </header>
  <div class="wb-sheet-body" data-sheet-body>
    <sc-for list="{{ mapRows }}" as="row" hint-placeholder-count="6">
      <sc-if value="{{ row.isPart }}">
        <h3 class="wb-map-heading">
          <button type="button" class="wb-map-part" id="{{ row.id }}" data-map-row data-state="{{ row.state }}" data-current="{{ row.current }}" aria-expanded="{{ row.expanded }}" aria-controls="{{ row.controls }}" onclick="{{ row.onToggle }}">
            <span class="wb-map-node" aria-hidden="true"></span>
            <span class="wb-map-text"><span class="wb-map-name">{{ row.name }}</span><span class="wb-map-meta">{{ row.meta }}</span><span class="wb-sr-only">{{ row.srState }}</span></span>
            <svg class="wb-map-chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </h3>
      </sc-if>
      <sc-if value="{{ row.isSteps }}">
        <ol class="wb-map-steps" id="{{ row.id }}" aria-labelledby="{{ row.headId }}">
          <sc-for list="{{ row.steps }}" as="step">
            <li>
              <button type="button" class="wb-map-step" id="{{ step.id }}" data-map-row data-acked="{{ step.acked }}" aria-current="{{ step.current }}" onclick="{{ step.onJump }}">
                <span class="wb-map-num"><span class="wb-sr-only">Step </span>{{ step.num }}<span class="wb-sr-only">{{ step.srOf }}</span></span>
                <span class="wb-map-step-text"><span class="wb-map-step-title">{{ step.title }}</span><span class="wb-map-excerpt">{{ step.excerpt }}</span><span class="wb-map-here">{{ step.here }}</span><span class="wb-sr-only">{{ step.srState }}</span></span>
              </button>
            </li>
          </sc-for>
        </ol>
      </sc-if>
    </sc-for>
  </div>
  <footer class="wb-sheet-foot">
    <button type="button" class="wb-button wb-button-quiet" onclick="{{ onPartsClose }}">Return to practice</button>
  </footer>
</dialog>

<sc-if value="{{ done }}">
  <div class="wb-complete">
    <div class="wb-complete-card wb-card">
      <p class="wb-proposed" id="wb-proposed">Proposed interface copy</p>
      <h2 id="wb-complete-title" tabindex="-1" aria-describedby="wb-proposed wb-complete-copy">{{ doneTitle }}</h2>
      <p class="wb-complete-copy" id="wb-complete-copy">{{ doneCopy }}</p>
      <div class="wb-complete-actions">
        <button type="button" class="wb-button wb-button-secondary" onclick="{{ onRevisit }}">Revisit practice</button>
        <button type="button" class="wb-button wb-button-primary" onclick="{{ onStartAgain }}">Start again</button>
      </div>
    </div>
  </div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { stage: 0, done: false, complete: false, partsOpen: false, mapPart: -1 };

  get STAGES() {
    const rows = [
      { eyebrow: 'Full Body Kriya', title: 'Wave Breathing', accent: '#57e0d6', bg: 'mountain' },
      { eyebrow: 'The Seat', title: 'Finding your seat', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 0, body: 'Sit your body comfortably on a flat surface. Whether in a chair or cross legged it is most important to be at ease.' },
      { eyebrow: 'The Seat', title: 'Lift the hips if tight', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 1, body: 'If the hips aren\u2019t open, sit up on a cushion.' },
      { eyebrow: 'The Seat', title: 'Shoulders relaxed', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 2, body: 'Let them drop and hang off the spine. Imagine gravity is pulling them down and keeping the spine straight.' },
      { eyebrow: 'The Seat', title: 'Spine upright', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 3, body: 'Tall, but never rigid.' },
      { eyebrow: 'The Seat', title: 'Position the head', accent: '#9fd4ff', bg: 'stars', graphic: 'seated', seat: 4, body: 'Chin slightly down to lengthen the cervical spine. Eyes lightly closed or partially open.' },
      { title: 'Place the hands', accent: '#9fd4ff', bg: 'stars', graphic: 'hands-down', body: 'Find a position for your hands there is no right or wrong; palms down on knees, palms up, or hands together in the lap. Let them rest and be sensitive.' },
      { eyebrow: 'The Seat', title: 'Heart emanates', accent: '#a98bff', bg: 'stars', graphic: 'seated', seat: 5, body: 'Imagine a gentle force moving outward from the solar plexus into the space around you' },
      { eyebrow: 'The Seat', title: 'Awareness of crown', accent: '#a98bff', bg: 'stars', graphic: 'seated', seat: 6, body: 'Rest a soft attention just above the head.' },
      { title: 'The empty vessel', accent: '#bcd0ff', bg: 'stars', graphic: 'empty-outline', still: true, body: 'Feel the outline of the body as an open vessel. Notice the space within, while the breath continues easily.' },
      { eyebrow: 'The Breath', title: 'Breathe in waves', accent: '#57e0d6', bg: 'stars', graphic: 'wave', body: 'Equal in, equal out. Never hold.' },
      { eyebrow: 'The Vessel', title: 'Fill & empty', accent: '#ff5e9c', bg: 'stars', graphic: 'vessel', body: 'Each breath fills and empties the whole body.' },
      { title: 'SO HUM', accent: '#bcd0ff', bg: 'stars', graphic: 'mantra', still: true, body: 'Upon inhalation gently intone the sound "SO" along the entire inhalation and then vocalize the sound "HA" along the exhalation ending with an "UMMM" much like an "OM".' },

      { title: 'SO HUM', accent: '#bcd0ff', bg: 'stars', graphic: 'mantra-cycle', still: true, body: 'After several rounds of quietly vocalizing the "SO HUM" rhythmic mantra then internalize the sounds in your inner mind until it becomes a steady almost involuntary inner sound.' },

      { title: 'Envision your spine', accent: '#bcd0ff', bg: 'stars', graphic: 'column', body: 'Visualize a hollow luminous column roughly in the center of your back. With every in-breath and out-breath it becomes more awake and energized.' },

      { title: (window.waveEnvironment === 'mountain' ? 'Ground, mountain, sky' : window.waveEnvironment === 'office' ? 'Seat, window, lamp' : 'Roots, trunk, branches'), accent: '#ffd27a', bg: 'finale', body: (window.waveEnvironment === 'mountain' ? 'Imagine your body in an empty expanse, spanning the ground, the mountain and the sky.' : window.waveEnvironment === 'office' ? 'Imagine your body settled in the room: your pelvis resting in the chair, your torso rising toward the window, and your crown open beneath the lamp.' : 'Imagine your body aligned with the tree: your pelvis and sacrum are the roots, your torso is the trunk, and your throat, head and crown are the branches.') },

      { title: 'Rest in the expanse', accent: '#ffd27a', bg: 'finale', body: (window.waveEnvironment === 'mountain' ? 'Let the horizon pass through the navel and the mountain peak meet the third eye. Allow the sky to open above you.' : window.waveEnvironment === 'office' ? 'Feel the chair beneath you and the quiet of the room around you. Let the window light rest at the brow, and the lamp stay soft above.' : 'Feel your pelvis rooted in the ground, your torso rising with the trunk, and your head opening into the branches. Rest in the space around and within the tree.') },

      { title: 'Bring the four together', accent: '#57e0d6', bg: 'finale', body: 'Find the seat. Follow the wave breath. Continue the SO-HUM rhythm in your mind. Hold the visualization. Let these four aspects support one practice.' },

      { title: 'Build familiarity', accent: '#57e0d6', bg: 'finale', scene: 'aligned-breath', body: 'Build your practice with the 4 anchors: Posture, Breath, Mantra and Visualization. If you become distracted always fall back on simple rhythmic breathing and work your way back up.' },

      { title: 'Let it become natural', accent: '#57e0d6', bg: 'finale', body: 'As the practice becomes familiar, soften the deliberate guidance. Let the rhythm become automatic, returning to an anchor whenever you need it.' },
      { title: 'Recognizing the Root Gurus', accent: '#ffdca1', bg: 'mountain', closing: true, body: 'At the end of the sit take a beat to send gratitude to all sentient beings, family, friends, mentors. Always send love to Mahavatar Babji and his line of Kriya gurus.' }
    ];
    const partNames = ['Posture','Breath','Mantra','Visualization','Integration','Compassion and Thanks'];
    const partCounts = [8, 3, 2, 3, 3, 1];
    const partOf = [null];
    partCounts.forEach((count, index) => { for (let n = 0; n < count; n++) partOf.push(partNames[index]); });
    if (partOf.length !== rows.length) console.warn('[wave] part list does not match the stage list');
    return rows.map((row, index) => ({ ...row, part: partOf[index] || null, body: row.body == null ? '' : row.body }));
  }

  chapterNames = ['Posture','Breath','Mantra','Visualization','Integration','Compassion and Thanks'];

  chapterFor(i) {
    const name = this.STAGES[i] && this.STAGES[i].part;
    if (!name) return 0;
    const index = this.chapterNames.indexOf(name);
    return index < 0 ? 0 : index + 1;
  }

  partIndexes(name, stages) {
    const indexes = [];
    (stages || this.STAGES).forEach((stage, index) => { if (stage.part === name) indexes.push(index); });
    return indexes;
  }

  placeFor(index, stages) {
    stages = stages || this.STAGES;
    const name = stages[index] && stages[index].part;
    if (!name) return null;
    const group = this.partIndexes(name, stages);
    return { name: name, step: group.indexOf(index) + 1, total: group.length, partIndex: this.chapterNames.indexOf(name) };
  }

  // Fill means acknowledged instructions. Continue and Finish acknowledge the
  // instruction on screen; Back, overview jumps and opening the map only move.
  // The intro is not an instruction, so it is never acknowledged.
  get acked() {
    return this._acked || (this._acked = new Set());
  }

  partGroups(stages) {
    return this.chapterNames.map((name, index) => {
      const indexes = this.partIndexes(name, stages);
      const acked = indexes.filter((i) => this.acked.has(i)).length;
      return { name: name, index: index, indexes: indexes, acked: acked, done: indexes.length > 0 && acked === indexes.length };
    });
  }

  locationFor(index, stages) {
    const place = this.placeFor(index, stages);
    if (!place) return 'Introduction';
    return place.name + ', part ' + (place.partIndex + 1) + ' of ' + this.chapterNames.length + ', step ' + place.step + ' of ' + place.total;
  }

  bindShell() {
    this.unbindShell();
    this._onKey = (e) => this.onKey(e);
    this._onBegin = () => this.beginPractice();
    this._onAppearance = () => this.onAppearance();
    window.addEventListener('keydown', this._onKey);
    document.addEventListener('wave-practice-begin', this._onBegin);
    document.addEventListener('wave-appearance-applied', this._onAppearance);
  }

  unbindShell() {
    if (this._onKey) window.removeEventListener('keydown', this._onKey);
    if (this._onBegin) document.removeEventListener('wave-practice-begin', this._onBegin);
    if (this._onAppearance) document.removeEventListener('wave-appearance-applied', this._onAppearance);
  }

  beginPractice() {
    this._acked = new Set();
    this._focusHeading = true;
    this.setState({ stage: 1, done: false, complete: false, partsOpen: false });
  }

  onAppearance() {
    if (window.waveSkinCommitted && typeof window.waveApplySkin === 'function') window.waveApplySkin();
    this.forceUpdate();
  }

  componentDidMount() {
    this._lastStage = this.state.stage;
    this._partsWasOpen = false;
    this.bindShell();
    this.applyStage();
    if (this._vTimer) clearInterval(this._vTimer);
    this.startVessel();
    document.dispatchEvent(new CustomEvent('wave-practice-ready'));
  }

  componentWillUnmount() {
    this.unbindShell();
    if (this._vTimer) clearInterval(this._vTimer);
  }

  componentDidUpdate() {
    const stageChanged = this._lastStage !== this.state.stage;
    this.syncDialog();
    if (stageChanged) {
      this._lastStage = this.state.stage;
      this.applyStage();
      if (!this.state.done) this.fadeText();
    }
    if (this._announce) {
      this._announce = false;
      const live = this.root && this.root.querySelector('[data-live]');
      const stages = this.STAGES;
      if (live && !this.state.done) live.textContent = this.locationFor(this.state.stage, stages) + '. ' + stages[this.state.stage].title;
    }
    if (window.waveSkinCommitted && typeof window.waveApplySkin === 'function') window.waveApplySkin();
    const focus = (selector) => {
      const el = this.root && this.root.querySelector(selector);
      if (el) el.focus({ preventScroll: true });
    };
    if (this._focusComplete) {
      this._focusComplete = false;
      focus('#wb-complete-title');
    } else if (this._focusHeading) {
      this._focusHeading = false;
      focus('[data-heading]');
    } else if (this._focusForward) {
      this._focusForward = false;
      focus('[data-forward]');
    } else if (this._focusRow) {
      // Rows are keyed by position, so an expanded part shifts the headings after
      // it; find the activated heading again by its id.
      focus('#' + this._focusRow);
      this._focusRow = null;
    } else if (this._partsWasOpen && !this.state.partsOpen) {
      focus('[data-parts-open]');
    }
    this._partsWasOpen = !!this.state.partsOpen;
  }

  // breath-paced fill: 0->1->2->3 (inhale) then 3->2->1->0 (exhale)
  startVessel() {
    const seq = [0, 1, 2, 3, 2, 1];
    let i = 0;
    this._vTimer = setInterval(() => {
      const figs = this.root && this.root.querySelectorAll('[data-vfig]');
      if (!figs || this.STAGES[this.state.stage].still) return;
      i = (i + 1) % seq.length;
      const on = seq[i];
      figs.forEach((f) => { f.style.transition = 'opacity 1.4s ease'; f.style.opacity = (+f.dataset.vfig === on) ? 1 : 0; });
    }, 1500);
  }

  applyStage() {
    if (!this.root) return;
    const s = this.state.stage, S = this.STAGES[s];
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('closing-page', !!S.closing);
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('intro-page', s === 0);
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('practice-page', s > 0 && !S.closing);
    this.root.querySelector('[data-graphiczone]').parentElement.style.mixBlendMode = 'normal';
    if (S.still) this.root.querySelectorAll('[data-vfig]').forEach(f => f.style.opacity = +f.dataset.vfig === 0 ? 1 : 0);
    const set = (n, op) => {
      const el = this.root.querySelector('[data-layer="' + n + '"]');
      if (!el) return;
      el.style.opacity = op;
      if (op) el.removeAttribute('aria-hidden');
      else el.setAttribute('aria-hidden', 'true');
    };
    const visualization = (this.chapterFor(s) >= 4 && S.bg === 'finale') || S.scene === 'aligned-breath';
    set('visualization', visualization ? 1 : 0);
    this.root.querySelector('[data-graphiczone]').parentElement.classList.toggle('tree-aligned', visualization);
    set('landscape', !visualization && (S.bg === 'mountain' || S.bg === 'finale') ? 1 : 0);
    set('stars', S.bg === 'stars' ? 1 : 0);
    set('finale', !visualization && S.bg === 'finale' ? 1 : 0);
    set('seated', S.graphic === 'seated' ? 1 : 0);
    set('wavediagram', S.graphic === 'wave' ? 1 : 0);
    set('vessel', S.graphic === 'vessel' ? 1 : 0);
    set('column', S.graphic === 'column' ? 1 : 0);
    set('mantra', S.graphic === 'mantra' ? 1 : 0);
    set('mantra-body', S.graphic === 'mantra-cycle' ? 1 : 0);
    this.root.querySelector('[data-layer="mantra-body"]').classList.toggle('mantra-active', S.graphic === 'mantra-cycle');
    set('mantra-so', S.graphic === 'mantra-cycle' ? 1 : 0);
    this.root.querySelector('[data-layer="mantra-so"]').classList.toggle('mantra-active', S.graphic === 'mantra-cycle');
    set('mantra-hum', S.graphic === 'mantra-cycle' ? 1 : 0);
    this.root.querySelector('[data-layer="mantra-hum"]').classList.toggle('mantra-active', S.graphic === 'mantra-cycle');
    set('empty-outline', S.graphic === 'empty-outline' ? 1 : 0);
    set('hands-down', S.graphic === 'hands-down' ? 1 : 0);
    this.root.querySelector('[data-layer="hands-down"]').classList.toggle('poses-active', S.graphic === 'hands-down');
    set('welcomedim', s === 0 ? 1 : 0);
    // mountain framing: title shows peak high; finale drops horizon to lower-centre
    const mtn = this.root.querySelector('[data-mountain]');
    if (mtn) mtn.style.objectPosition = S.bg === 'finale' ? 'center 48%' : 'center 40%';
    this.root.querySelectorAll('[data-seat]').forEach((im) => {
      const on = S.graphic === 'seated' && +im.dataset.seat === S.seat;
      im.style.opacity = on ? 1 : 0;
      if (on) im.removeAttribute('aria-hidden');
      else im.setAttribute('aria-hidden', 'true');
    });
    // Only the intro keeps its eyebrow; the navigator says which part this is.
    const eb = this.root.querySelector('[data-eyebrow]');
    if (eb) {
      eb.style.color = S.accent || '#57e0d6';
      eb.style.display = s === 0 ? '' : 'none';
    }
    const body = this.root.querySelector('[data-body]');
    const rem = this.root.querySelector('[data-remember]');
    if (body) body.style.display = (S.body && !S.remember) ? 'block' : 'none';
    if (rem) rem.style.display = S.remember ? 'flex' : 'none';
  }

  fadeText() {
    const el = this.root && this.root.querySelector('[data-textzone]');
    if (!el) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      el.style.transition = 'none';
      el.style.opacity = '1';
      el.style.transform = 'none';
      return;
    }
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    requestAnimationFrame(() => {
      el.style.transition = 'opacity .45s ease, transform .45s ease';
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
  }

  // Moves without acknowledging anything.
  go(i) {
    if (this.state.done || this.state.partsOpen) return;
    if (i < 0 || i > this.STAGES.length - 1 || i === this.state.stage) return;
    this._announce = true;
    if (i === 0) this._focusForward = true; // Back is disabled on the intro
    this.setState({ stage: i });
  }

  // A click on the scene uses the same step as Continue. The instruction,
  // the navigation bar, and any open dialog keep their own clicks.
  onSceneClick(e) {
    if (e.defaultPrevented) return;
    const picker = document.getElementById('skin-picker');
    if (picker && !picker.hidden) return;
    const target = e.target;
    if (target && target.closest && target.closest('button, a, input, textarea, select, label, dialog, [data-textzone], .wb-bar, .wb-complete, #skin-picker, #skin-reopen')) return;
    this.advance();
  }

  // Continue: acknowledge the instruction on screen once, then advance once.
  advance() {
    if (this.state.done || this.state.partsOpen) return;
    const stage = this.state.stage;
    if (this.placeFor(stage)) this.acked.add(stage);
    if (stage >= this.STAGES.length - 1) this.finish();
    else this.go(stage + 1);
  }

  finish() {
    const complete = this.partGroups(this.STAGES).every((group) => group.done);
    this._focusComplete = true;
    this.setState({ done: true, complete: complete, partsOpen: false });
  }

  jumpToStep(i) {
    if (this.state.done) return;
    this._focusHeading = true;
    if (i !== this.state.stage) this._announce = true;
    this.setState({ stage: i, partsOpen: false });
  }

  openOverview() {
    if (this.state.done || this.state.partsOpen) return;
    const place = this.placeFor(this.state.stage);
    // On the intro, Posture opens for a look without becoming current.
    this.setState({ partsOpen: true, mapPart: place ? place.partIndex : 0 });
  }

  onKey(e) {
    const picker = document.getElementById('skin-picker');
    if (picker && !picker.hidden) return;
    if (this.state.partsOpen) {
      this.onPartsKey(e);
      return;
    }
    if (this.state.done || e.defaultPrevented) return;
    if (e.altKey || e.metaKey || e.ctrlKey || e.repeat) return;
    const target = e.target;
    if (!target || !target.tagName) return;
    const tag = target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable) return;
    if (target.closest && target.closest('dialog[open]')) return;
    if ((e.key === ' ' || e.key === 'Enter') && target.closest && target.closest('button, a')) return;
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault();
      this.advance();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      this.go(this.state.stage - 1);
    }
  }

  // Up/Down, Home and End move between the visible part headings and steps.
  // Enter/Space keep their meaning: a heading expands, a step jumps.
  onPartsKey(e) {
    const dialog = this.root && this.root.querySelector('[data-parts-dialog]');
    if (!dialog || !dialog.contains(document.activeElement)) return;
    const rows = [...dialog.querySelectorAll('[data-map-row]')].filter((row) => !row.disabled && row.offsetParent !== null);
    const index = rows.indexOf(document.activeElement);
    if (index < 0 || !rows.length) return;
    let next = -1;
    if (e.key === 'ArrowDown') next = Math.min(index + 1, rows.length - 1);
    else if (e.key === 'ArrowUp') next = Math.max(index - 1, 0);
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = rows.length - 1;
    if (next < 0) return;
    e.preventDefault();
    rows[next].focus();
  }

  syncDialog() {
    const dialog = this.root && this.root.querySelector('[data-parts-dialog]');
    if (!dialog) return;
    if (this.state.partsOpen) {
      if (!dialog.open && dialog.showModal) {
        try { dialog.showModal(); } catch (err) {}
      }
      if (!this._partsWasOpen) {
        const heading = dialog.querySelector('#wb-sheet-title');
        if (heading) heading.focus({ preventScroll: true });
        const body = dialog.querySelector('[data-sheet-body]');
        const here = dialog.querySelector('[aria-current="step"]');
        if (body) body.scrollTop = 0;
        if (body && here) {
          const top = here.getBoundingClientRect().top - body.getBoundingClientRect().top;
          if (top + here.offsetHeight > body.clientHeight) body.scrollTop = top - body.clientHeight / 3;
        }
      }
    } else if (dialog.open) {
      dialog.close();
    }
  }

  renderVals() {
    const stages = this.STAGES;
    const stage = this.state.stage;
    const s = stages[stage];
    const place = this.placeFor(stage, stages);
    const groups = this.partGroups(stages);
    const partCount = this.chapterNames.length;
    const atEnd = stage >= stages.length - 1;
    const reviewing = !!place && this.acked.has(stage);
    const stepText = place ? (reviewing ? 'Reviewing · ' : '') + 'Step ' + place.step + ' of ' + place.total : '';
    const instructionCount = groups.reduce((sum, group) => sum + group.indexes.length, 0);

    // Six equal sections, not durations: each fills by its own acknowledged share.
    const segments = groups.map((group) => {
      const current = !!place && place.partIndex === group.index;
      return {
        done: group.done ? 'true' : 'false',
        current: current ? 'true' : 'false',
        fill: 'width:' + (group.acked / group.indexes.length * 100) + '%'
      };
    });

    const mapRows = [];
    groups.forEach((group) => {
      const current = !!place && place.partIndex === group.index;
      const expanded = this.state.mapPart === group.index;
      const id = 'wb-map-part-' + group.index;
      const listId = 'wb-map-steps-' + group.index;
      const total = group.indexes.length;
      const meta = current ? stepText
        : group.done ? 'Done'
        : group.acked ? group.acked + ' of ' + total + ' done'
        : total + (total === 1 ? ' step' : ' steps');
      mapRows.push({
        isPart: true,
        id: id,
        name: group.name,
        meta: meta,
        state: group.done ? 'done' : group.acked ? 'partial' : 'upcoming',
        current: current ? 'true' : 'false',
        srState: current ? ', current part' : group.done ? ', completed' : '',
        expanded: expanded,
        controls: expanded ? listId : undefined,
        onToggle: (e) => {
          e.stopPropagation();
          this._focusRow = id;
          this.setState({ mapPart: expanded ? -1 : group.index });
        }
      });
      if (!expanded) return;
      // Repeated titles (the two SO HUM steps) also show the opening of their text.
      const titles = group.indexes.map((i) => stages[i].title);
      mapRows.push({
        isSteps: true,
        id: listId,
        headId: id,
        steps: group.indexes.map((i, n) => {
          const acked = this.acked.has(i);
          const here = i === stage;
          const repeated = titles.filter((title) => title === stages[i].title).length > 1;
          const words = stages[i].body.split(/\s+/);
          return {
            id: 'wb-map-step-' + i,
            num: n + 1,
            srOf: ' of ' + total + ': ',
            title: stages[i].title,
            excerpt: repeated ? words.slice(0, 6).join(' ') + (words.length > 6 ? '…' : '') : '',
            acked: acked ? 'true' : 'false',
            current: here ? 'step' : undefined,
            here: here ? (acked ? 'Reviewing · You are here' : 'You are here') : '',
            srState: acked && !here ? ', completed' : '',
            onJump: (e) => { e.stopPropagation(); this.jumpToStep(i); }
          };
        })
      });
    });

    const next = atEnd ? null : stages[stage + 1];
    const boundary = !!next && !!next.part && next.part !== s.part;
    const complete = !!this.state.complete;
    return {
      rootRef: (el) => { this.root = el; },
      stages: stages,
      eyebrow: stage === 0 ? s.eyebrow : '',
      title: s.title,
      body: s.body,
      reminders: [
        'Never fully fill or empty.',
        'Keep the diaphragm soft.',
        'Let the rhythm turn involuntary.',
        'Always picture in and out.',
        'Pairs with any kriya.'
      ],
      done: !!this.state.done,
      doneAttr: this.state.done ? 'true' : 'false',
      doneTitle: complete ? 'This sitting is complete.' : 'Practice ended.',
      doneCopy: complete
        ? 'Rest here, look through the practice again, or begin once more.'
        : 'Steps you moved past stay open. Revisit the practice to return to them, or begin once more.',
      partsOpen: !!this.state.partsOpen,
      practiceLocked: this.state.done ? true : undefined,
      practiceHidden: this.state.done ? true : undefined,
      navName: 'View session. ' + (place ? this.locationFor(stage, stages) + (reviewing ? ', reviewing' : '') : 'Introduction, ' + partCount + ' parts') + '.',
      navTitle: place ? place.name : 'Introduction',
      navStep: place ? stepText : partCount + ' parts',
      segments: segments,
      mapRows: mapRows,
      mapWhere: place
        ? place.name + ' · Part ' + (place.partIndex + 1) + ' of ' + partCount + ' · ' + stepText
        : 'Introduction · ' + partCount + ' parts, ' + instructionCount + ' steps',
      backDisabled: stage <= 0,
      forwardLong: atEnd ? 'Finish session' : boundary ? 'Next: ' + next.part : 'Continue',
      forwardShort: atEnd ? 'Finish session' : 'Continue',
      forwardExtra: boundary ? ' to ' + next.part : '',
      nextCaption: boundary ? 'Next: ' + next.part : '',
      onSceneClick: (e) => this.onSceneClick(e),
      onBack: (e) => { e.stopPropagation(); this.go(stage - 1); },
      onForward: (e) => { e.stopPropagation(); this.advance(); },
      onPartsOpen: (e) => { e.stopPropagation(); this.openOverview(); },
      onPartsClose: (e) => { e.stopPropagation(); this.setState({ partsOpen: false }); },
      onPartsDismiss: () => { if (this.state.partsOpen) this.setState({ partsOpen: false }); },
      onPartsBackdrop: (e) => { if (e.target === e.currentTarget) this.setState({ partsOpen: false }); },
      onRevisit: (e) => { e.stopPropagation(); this._focusHeading = true; this.setState({ done: false, stage: 0, partsOpen: false }); },
      onStartAgain: (e) => { e.stopPropagation(); this.beginPractice(); }
    };
  }
}
</script>
