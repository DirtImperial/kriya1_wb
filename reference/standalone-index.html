<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave Breathing · Full Body Kriya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,16..72,300;0,16..72,400;1,16..72,300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #04040a; height: 100%; }
::-webkit-scrollbar { width: 0; height: 0; }

@keyframes kenburns    { 0%{transform:scale(1)} 100%{transform:scale(1.09)} }
@keyframes crownPulse  { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
@keyframes hintBob     { 0%,100%{transform:translateX(0);opacity:.55} 50%{transform:translateX(6px);opacity:1} }
@keyframes twinkle     { 0%,100%{opacity:.45} 50%{opacity:.9} }

/* ── Root container ── */
#app {
  position: relative;
  height: 100dvh;
  overflow: hidden;
  background: #04040a;
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  cursor: pointer;
  user-select: none;
}

/* ── Visual layers ── */
#layer-landscape {
  position: absolute;
  inset: 0;
  z-index: 0;
  opacity: 1;
  transition: opacity 1.1s ease;
}
#layer-landscape img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 40%;
  animation: kenburns 26s ease-in-out infinite alternate;
}

/* ── Seated sequence layer (linear dodge over landscape) ── */
#layer-seated {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0;
  transition: opacity 1.1s ease;
  mix-blend-mode: plus-lighter; /* CSS linear dodge */
  display: flex;
  align-items: center;
  justify-content: center;
}
#seat-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  transition: opacity 0.5s ease;
}

#layer-chakra {
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0;
  transition: opacity 1.7s ease 0.5s;
  mix-blend-mode: screen;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
#layer-chakra img {
  height: 86%;
  width: auto;
  margin-top: -3%;
}

#layer-complete {
  position: absolute;
  inset: 0;
  z-index: 3;
  opacity: 0;
  transition: opacity 1.4s ease;
}
#layer-complete img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 42%;
  animation: crownPulse 7s ease-in-out infinite;
}

/* ── Ambient stars ── */
#stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  opacity: .5;
  mix-blend-mode: screen;
  background-image:
    radial-gradient(1.4px 1.4px at 16% 22%, #fff, transparent),
    radial-gradient(1px   1px   at 34% 14%, #cdd6ff, transparent),
    radial-gradient(1.3px 1.3px at 72% 18%, #fff, transparent),
    radial-gradient(1px   1px   at 88% 30%, #d7c4ff, transparent),
    radial-gradient(1px   1px   at 24%  8%, #fff, transparent);
  animation: twinkle 6s ease-in-out infinite;
}

/* ── Overlays ── */
#welcomedim {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  opacity: 1;
  transition: opacity 1.1s ease;
  background: rgba(4,4,12,.5);
}
#vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: radial-gradient(120% 90% at 50% 38%, transparent 40%, rgba(4,4,12,.55) 100%);
}
#scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 62%;
  pointer-events: none;
  z-index: 6;
  background: linear-gradient(180deg, transparent 0%, rgba(4,4,12,.4) 42%, rgba(4,4,12,.86) 100%);
}

/* ── Text panel ── */
#text-panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  padding: clamp(28px,5vw,72px);
  padding-bottom: clamp(76px,11vh,120px);
  display: flex;
  justify-content: flex-start;
  pointer-events: none;
}
#text-wrap {
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: clamp(12px,1.6vw,18px);
}
#eyebrow {
  font-size: clamp(.7rem,1.6vw,.84rem);
  letter-spacing: .38em;
  text-transform: uppercase;
}
#stage-title {
  font-weight: 600;
  font-size: clamp(2.1rem,6.6vw,4.4rem);
  line-height: 1;
  letter-spacing: -.02em;
  text-wrap: balance;
}
#body-text {
  font-family: 'Newsreader', serif;
  font-weight: 300;
  font-size: clamp(1.08rem,2.5vw,1.5rem);
  color: rgba(255,255,255,.85);
  line-height: 1.6;
  max-width: 600px;
}
#reminders {
  display: none;
  flex-direction: column;
  gap: 12px;
  margin-top: 2px;
  list-style: none;
}
#reminders li {
  display: flex;
  gap: 13px;
  align-items: baseline;
  font-family: 'Newsreader', serif;
  font-weight: 300;
  font-size: clamp(1rem,2.3vw,1.28rem);
  color: rgba(255,255,255,.85);
  line-height: 1.5;
}
.bullet {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #57e0d6;
  transform: translateY(2px);
}
#hint {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  font-size: .72rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
}
.hint-arrow { animation: hintBob 1.8s ease-in-out infinite; font-size: 1rem; }

/* ── Navigation bar ── */
#nav {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  padding: clamp(20px,3vw,34px) clamp(28px,5vw,72px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
#btn-prev, #btn-next {
  pointer-events: auto;
  cursor: pointer;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .74rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 11px 20px;
  border-radius: 999px;
  transition: opacity .3s ease, background .2s ease, transform .2s ease;
}
#btn-prev {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.22);
  color: #fff;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
#btn-prev:hover { background: rgba(255,255,255,.16); }
#btn-next {
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(255,255,255,.9);
  color: #0a0a14;
  font-weight: 600;
}
#btn-next:hover { transform: translateY(-1px); }

#dots {
  pointer-events: auto;
  display: flex;
  gap: 10px;
  align-items: center;
}
.dot {
  display: block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
  cursor: pointer;
  transition: all .35s ease;
  border: none;
  padding: 0;
}
.dot.active {
  background: #fff;
  transform: scale(1.5);
  width: 11px;
  height: 11px;
}
</style>
</head>
<body>
<div id="app">

  <!-- Visual layers -->
  <div id="layer-landscape">
    <img src="project/assets/01-landscape.png" alt="">
  </div>

  <!-- Seated frames — linear dodge over landscape -->
  <div id="layer-seated">
    <img id="seat-img" src="project/assets/seated/Seat_01.png" alt="">
  </div>

  <!-- Chakra energy column — screen blend, stage 4 only -->
  <div id="layer-chakra">
    <img src="project/assets/04-chakra.png" alt="">
  </div>

  <div id="layer-complete">
    <img src="project/assets/05-complete.png" alt="">
  </div>

  <div id="stars"></div>
  <div id="welcomedim"></div>
  <div id="vignette"></div>
  <div id="scrim"></div>

  <!-- Text panel -->
  <div id="text-panel">
    <div id="text-wrap">
      <div id="eyebrow"></div>
      <h1 id="stage-title"></h1>
      <p id="body-text"></p>
      <ul id="reminders">
        <li><span class="bullet"></span><span>Never fill or empty the lungs completely.</span></li>
        <li><span class="bullet"></span><span>Keep the diaphragm free of tension.</span></li>
        <li><span class="bullet"></span><span>Let the breath become rhythmic, almost involuntary.</span></li>
        <li><span class="bullet"></span><span>Always visualize the influx and the outflux.</span></li>
        <li><span class="bullet"></span><span>Wave breathing can accompany all kriyas.</span></li>
      </ul>
      <div id="hint">
        <span id="hint-text"></span>
        <span class="hint-arrow">→</span>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav id="nav">
    <button id="btn-prev">← Back</button>
    <div id="dots"></div>
    <button id="btn-next">Next →</button>
  </nav>

</div>
<script>
const STAGES = [
  {
    eyebrow: 'Full Body Kriya',
    title:   'Wave Breathing',
    accent:  '#57e0d6',
    body:    'A guided practice from the body, to the breath, to the subtle spine. Move through each stage at your own pace — also beautiful lying down.',
    hint:    'Tap anywhere or press → to begin'
  },
  {
    eyebrow: '01 · The Seat',
    title:   'Find your seat',
    accent:  '#ffb463',
    body:    'Settle into a stable, easy posture — seated or lying down. Spine long, shoulders soft. Sense yourself rooted to the earth like a mountain, crowned by open sky.',
    hint:    'Next'
  },
  {
    eyebrow: '02 · The Wave Breath',
    title:   'Breathe in slow waves',
    accent:  '#57e0d6',
    body:    'Inhale and exhale for equal durations — never quite filling, never quite emptying, never holding. Let the rhythm become almost involuntary, like tide against the shore.',
    hint:    'Next'
  },
  {
    eyebrow: '03 · Fill & Empty',
    title:   'Fill and empty the vessel',
    accent:  '#ff5e9c',
    body:    'The in-breath fills and charges the skull and upper torso; the out-breath suffuses the pelvis and the legs — expanding into the cosmos, rooting into the earth.',
    hint:    'Next'
  },
  {
    eyebrow: '04 · Move the Prana',
    title:   'Move energy through the spine',
    accent:  '#a98bff',
    body:    'Draw prana up from the base of the spine into the skull as you inhale; release it back down as you exhale. The centres awaken in turn — always visualize the influx and the outflux.',
    hint:    'Next'
  },
  {
    eyebrow: '05 · Penetrate the Spine',
    title:   'Breathing as one',
    accent:  '#ffd27a',
    body:    'Gather all attention into the spinal channel itself. Breath, energy and awareness move as a single current — the crown opens, and the whole practice unifies.',
    hint:    'Next'
  },
  {
    eyebrow: 'Remember',
    title:   'Carry this with you',
    accent:  '#57e0d6',
    body:    '',
    hint:    'Start again'
  }
];

const LAST = STAGES.length - 1;
let stage = 0;

// ── Seated frame cycle ──
const SEAT_FRAMES = [
  'Seat_01','Seat_02','Seat_03','Seat_04',
  'Seat_05','Seat_06','Seat_07','Seat_09'
];
let seatIdx = 0;
let seatTimer = null;

function advanceSeat() {
  const img = document.getElementById('seat-img');
  img.style.opacity = '0';
  setTimeout(() => {
    seatIdx = (seatIdx + 1) % SEAT_FRAMES.length;
    img.src  = `project/assets/seated/${SEAT_FRAMES[seatIdx]}.png`;
    img.style.opacity = '1';
  }, 500);
}

function startSeatCycle() {
  if (seatTimer) return;
  seatTimer = setInterval(advanceSeat, 2500);
}

function stopSeatCycle() {
  clearInterval(seatTimer);
  seatTimer = null;
}

// Build progress dots
const dotsEl = document.getElementById('dots');
STAGES.forEach((_, i) => {
  const d = document.createElement('span');
  d.className = 'dot';
  d.addEventListener('click', e => { e.stopPropagation(); go(i); });
  dotsEl.appendChild(d);
});

function applyStage() {
  const s  = stage;
  const st = STAGES[s];

  // Layer visibility
  // Landscape stays up for all stages 0-4 (backdrop for seated figures)
  document.getElementById('layer-landscape').style.opacity = s <= 4 ? '1' : '0';
  // Seated figures visible stages 1-4, cycling with linear dodge
  const showSeated = s >= 1 && s <= 4;
  document.getElementById('layer-seated').style.opacity = showSeated ? '1' : '0';
  if (showSeated) startSeatCycle(); else stopSeatCycle();
  document.getElementById('layer-chakra').style.opacity   = s === 4 ? '1' : '0';
  document.getElementById('layer-complete').style.opacity = s >= 5 ? '1' : '0';
  document.getElementById('welcomedim').style.opacity     = s === 0 ? '1' : '0';

  // Text content
  const eyebrow = document.getElementById('eyebrow');
  eyebrow.style.color  = st.accent;
  eyebrow.textContent  = st.eyebrow;
  document.getElementById('stage-title').textContent = st.title;

  const isRemember = s === LAST;
  const bodyEl = document.getElementById('body-text');
  const remEl  = document.getElementById('reminders');
  bodyEl.style.display = isRemember ? 'none' : 'block';
  bodyEl.textContent   = st.body;
  remEl.style.display  = isRemember ? 'flex'  : 'none';

  document.getElementById('hint-text').textContent = st.hint;

  // Progress dots
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === s));

  // Back / next buttons
  const prev = document.getElementById('btn-prev');
  prev.style.opacity      = s === 0 ? '0' : '1';
  prev.style.pointerEvents = s === 0 ? 'none' : 'auto';
  document.getElementById('btn-next').textContent = s === LAST ? 'Done' : 'Next →';
}

function fadeText() {
  const el = document.getElementById('text-wrap');
  el.style.transition = 'none';
  el.style.opacity    = '0';
  el.style.transform  = 'translateY(10px)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = 'opacity .6s ease, transform .6s ease';
    el.style.opacity    = '1';
    el.style.transform  = 'none';
  }));
}

function go(i) {
  if (i < 0)    i = 0;
  if (i > LAST) i = 0; // Done loops back to start
  if (i === stage) return;
  stage = i;
  applyStage();
  fadeText();
}

// Interactions
document.getElementById('app').addEventListener('click',     ()  => go(stage + 1));
document.getElementById('btn-prev').addEventListener('click', e  => { e.stopPropagation(); go(stage - 1); });
document.getElementById('btn-next').addEventListener('click', e  => { e.stopPropagation(); go(stage + 1); });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(stage + 1); }
  else if (e.key === 'ArrowLeft')               { e.preventDefault(); go(stage - 1); }
});

applyStage();
</script>
</body>
</html>
